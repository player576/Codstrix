<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Складской учет PRO (QR + Excel + Users)</title>

<!-- QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

:root{
  --bg:#f0f2f5;
  --card:#ffffff;
  --primary:#3498db;
  --success:#2ecc71;
  --danger:#e74c3c;
  --warning:#f39c12;
  --dark:#34495e;
}

*{
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:var(--bg);
  margin:0;
  padding:10px;
}

/* ========================= */
/* AUTH SCREEN */
/* ========================= */

#authScreen{
  max-width:420px;
  margin:80px auto;
  background:white;
  border-radius:18px;
  padding:30px;
  box-shadow:0 4px 20px rgba(0,0,0,0.15);
}

.auth-title{
  text-align:center;
  font-size:30px;
  margin-bottom:25px;
  color:#2c3e50;
}

.auth-input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:12px;
  font-size:15px;
}

.auth-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
  transition:0.3s;
}

.auth-btn:hover{
  opacity:0.9;
}

.login-btn{
  background:#3498db;
}

.register-btn{
  background:#2ecc71;
}

#loadingBox{
  display:none;
  text-align:center;
  margin-top:20px;
}

.loader{
  width:50px;
  height:50px;
  border:5px solid #ddd;
  border-top:5px solid #3498db;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

/* ========================= */
/* APP */
/* ========================= */

.container{
  display:none;
  max-width:1400px;
  margin:auto;
  background:var(--card);
  padding:20px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  overflow-x:auto;
}

h1{
  text-align:center;
  color:#2c3e50;
  margin-bottom:20px;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
  flex-wrap:wrap;
}

.user-box{
  background:#ecf0f1;
  padding:10px 15px;
  border-radius:10px;
  font-size:14px;
}

.logout-btn{
  background:var(--danger);
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
  margin-bottom:20px;
}

input{
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  outline:none;
  font-size:14px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  opacity:0.9;
}

.btn-add{
  background:var(--success);
}

.btn-scan{
  background:var(--primary);
}

.btn-excel{
  background:#27ae60;
}

.btn-share{
  background:#1da1f2;
  font-size:12px;
}

.btn-edit{
  background:var(--warning);
  font-size:12px;
}

.btn-del{
  background:var(--danger);
  font-size:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  min-width:1100px;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
  vertical-align:middle;
}

th{
  background:var(--dark);
  color:white;
}

.qr-container{
  display:flex;
  justify-content:center;
  align-items:center;
  min-width:190px;
  min-height:190px;
}

.qr-container img{
  width:180px;
  height:180px;
  image-rendering:pixelated;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
}

#reader{
  width:100%;
  max-width:420px;
  margin:15px auto;
  border-radius:12px;
  overflow:hidden;
  border:3px solid #3498db;
}

.total-box{
  margin-top:20px;
  text-align:right;
  font-size:22px;
  font-weight:bold;
  color:#2c3e50;
}

.empty-box{
  text-align:center;
  padding:30px;
  color:#7f8c8d;
  font-size:18px;
}

@media(max-width:768px){

  table{
    font-size:13px;
  }

  th,td{
    padding:8px;
  }

  .qr-container img{
    width:150px;
    height:150px;
  }

  .top-bar{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>

</head>

<body>

<!-- ========================= -->
<!-- AUTH -->
<!-- ========================= -->

<div id="authScreen">

  <div class="auth-title">
    🔐 Склад PRO
  </div>

  <input
    type="email"
    id="email"
    class="auth-input"
    placeholder="Введите email"
  >

  <input
    type="password"
    id="password"
    class="auth-input"
    placeholder="Введите пароль"
  >

  <button
    class="auth-btn login-btn"
    onclick="login()"
  >
    Войти
  </button>

  <button
    class="auth-btn register-btn"
    onclick="register()"
  >
    Регистрация
  </button>

  <div id="loadingBox">

    <div class="loader"></div>

    <div style="margin-top:15px">
      Загрузка...
    </div>

  </div>

</div>

<!-- ========================= -->
<!-- APP -->
<!-- ========================= -->

<div class="container" id="appContainer">

  <div class="top-bar">

    <div class="user-box">
      👤 <span id="userEmail"></span>
    </div>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      🚪 Выйти
    </button>

  </div>

  <h1>📦 Складской учет (QR + Excel)</h1>

  <div class="form">

    <input
      type="text"
      id="name"
      placeholder="Название"
    >

    <input
      type="number"
      id="qty"
      placeholder="Остаток"
    >

    <input
      type="text"
      id="unit"
      placeholder="Ед. (шт/кг)"
    >

    <input
      type="number"
      id="price"
      placeholder="Цена ₴"
    >

    <button
      class="btn-add"
      onclick="addItem()"
    >
      ➕ Добавить
    </button>

    <button
      class="btn-scan"
      onclick="startScanner()"
    >
      📷 Сканировать QR
    </button>

    <button
      class="btn-excel"
      onclick="exportExcel()"
    >
      📊 Excel
    </button>

  </div>

  <div id="reader"></div>

  <table>

    <thead>

      <tr>

        <th>Товар</th>

        <th>Остаток</th>

        <th>Цена</th>

        <th>Сумма</th>

        <th>QR-Код</th>

        <th>Действия</th>

      </tr>

    </thead>

    <tbody id="tableBody"></tbody>

  </table>

  <div class="empty-box" id="emptyBox" style="display:none">
    📦 Склад пуст
  </div>

  <div class="total-box">

    💰 Общая сумма:
    <span id="grandTotal">0</span> ₴

  </div>

</div>

<script>

/* ========================= */
/* SUPABASE */
/* ========================= */

const SUPABASE_URL =
  "https://zwoaxfrijvtfclzdodpf.supabase.co";

const SUPABASE_KEY =
  "ВСТАВЬ_СВОЙ_ANON_KEY";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

/* ========================= */
/* GLOBAL */
/* ========================= */

let inventory = [];

let user = null;

let lastQrState = {};

let scannerRunning = false;

/* ========================= */
/* SAVE LOCAL */
/* ========================= */

function saveLocal(){

  localStorage.setItem(
    "my_inventory",
    JSON.stringify(inventory)
  );

}

/* ========================= */
/* LOADING */
/* ========================= */

function showLoading(){

  document.getElementById(
    "loadingBox"
  ).style.display = "block";

}

function hideLoading(){

  document.getElementById(
    "loadingBox"
  ).style.display = "none";

}

/* ========================= */
/* REGISTER */
/* ========================= */

async function register(){

  const email =
    document.getElementById("email")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value
    .trim();

  if(!email || !password){

    alert(
      "Введите email и пароль"
    );

    return;
  }

  showLoading();

  const { error } =
    await supabaseClient.auth.signUp({

      email:email,

      password:password

    });

  hideLoading();

  if(error){

    alert(error.message);

    return;
  }

  alert(
    "✅ Регистрация успешна"
  );

}

/* ========================= */
/* LOGIN */
/* ========================= */

async function login(){

  const email =
    document.getElementById("email")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value
    .trim();

  if(!email || !password){

    alert(
      "Введите email и пароль"
    );

    return;
  }

  showLoading();

  const { data, error } =
    await supabaseClient
    .auth
    .signInWithPassword({

      email:email,

      password:password

    });

  hideLoading();

  if(error){

    alert(error.message);

    return;
  }

  user = data.user;

  document.getElementById(
    "userEmail"
  ).textContent = user.email;

  openApp();

}

/* ========================= */
/* OPEN APP */
/* ========================= */

async function openApp(){

  document.getElementById(
    "authScreen"
  ).style.display = "none";

  document.getElementById(
    "appContainer"
  ).style.display = "block";

  await loadInventory();

}

/* ========================= */
/* LOGOUT */
/* ========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}

/* ========================= */
/* LOAD INVENTORY */
/* ========================= */

async function loadInventory(){

  const { data, error } =
    await supabaseClient
    .from("inventory")
    .select("*")
    .eq("user_id", user.id)
    .order("created_at",{
      ascending:false
    });

  if(error){

    alert(
      "Ошибка загрузки склада"
    );

    return;
  }

  inventory = data || [];

  render();

}

/* ========================= */
/* RENDER */
/* ========================= */

function render(){

  const tbody =
    document.getElementById(
      "tableBody"
    );

  const grandTotal =
    document.getElementById(
      "grandTotal"
    );

  const emptyBox =
    document.getElementById(
      "emptyBox"
    );

  tbody.innerHTML = "";

  let totalSum = 0;

  if(inventory.length === 0){

    emptyBox.style.display = "block";

  }else{

    emptyBox.style.display = "none";

  }

  inventory.forEach((item,index)=>{

    const row =
      document.createElement("tr");

    const qrData =
      encodeURIComponent(
        JSON.stringify({

          name:item.name,

          qty:Number(item.qty),

          unit:item.unit,

          price:Number(item.price)

        })
      );

    const itemSum =
      Number(item.qty) *
      Number(item.price);

    totalSum += itemSum;

    row.innerHTML = `

      <td>
        <strong>${item.name}</strong>
      </td>

      <td>
        ${Number(item.qty)} ${item.unit}
      </td>

      <td>
        ${Number(item.price).toFixed(2)} ₴
      </td>

      <td>
        <strong>
          ${itemSum.toFixed(2)} ₴
        </strong>
      </td>

      <td class="qr-container">

        <div id="qr-${index}"></div>

      </td>

      <td>

        <div class="actions">

          <button
            class="btn-share"
            onclick="shareQR(${index})"
          >
            📲 Переслать
          </button>

          <button
            class="btn-edit"
            onclick="editItem(${index})"
          >
            ✏️ Изменить
          </button>

          <button
            class="btn-del"
            onclick="deleteItem('${item.id}')"
          >
            🗑 Удалить
          </button>

        </div>

      </td>

    `;

    tbody.appendChild(row);

    const qrElement =
      document.getElementById(
        `qr-${index}`
      );

    qrElement.innerHTML = "";

    new QRCode(qrElement,{

      text:qrData,

      width:180,

      height:180,

      colorDark:"#000000",

      colorLight:"#ffffff",

      correctLevel:QRCode.CorrectLevel.H

    });

  });

  grandTotal.textContent =
    totalSum.toFixed(2);

}

/* ========================= */
/* ADD ITEM */
/* ========================= */

async function addItem(){

  const name =
    document.getElementById("name")
    .value
    .trim();

  const qty =
    Number(
      document.getElementById("qty")
      .value
    );

  const unit =
    document.getElementById("unit")
    .value
    .trim() || "шт";

  const price =
    Number(
      document.getElementById("price")
      .value
    ) || 0;

  if(!name || isNaN(qty)){

    alert(
      "Введите название и остаток"
    );

    return;
  }

  const { error } =
    await supabaseClient
    .from("inventory")
    .insert({

      user_id:user.id,

      name:name,

      qty:qty,

      unit:unit,

      price:price

    });

  if(error){

    alert(
      "Ошибка добавления"
    );

    return;
  }

  document.getElementById(
    "name"
  ).value = "";

  document.getElementById(
    "qty"
  ).value = "";

  document.getElementById(
    "unit"
  ).value = "";

  document.getElementById(
    "price"
  ).value = "";

  await loadInventory();

}

/* ========================= */
/* DELETE */
/* ========================= */

async function deleteItem(id){

  if(!confirm(
    "Удалить товар?"
  )) return;

  await supabaseClient
  .from("inventory")
  .delete()
  .eq("id",id);

  await loadInventory();

}

/* ========================= */
/* EDIT */
/* ========================= */

async function editItem(index){

  const item =
    inventory[index];

  const newName =
    prompt(
      "Название:",
      item.name
    );

  if(newName === null) return;

  const newQty =
    prompt(
      "Остаток:",
      item.qty
    );

  if(newQty === null) return;

  const newUnit =
    prompt(
      "Единица:",
      item.unit
    );

  if(newUnit === null) return;

  const newPrice =
    prompt(
      "Цена:",
      item.price
    );

  if(newPrice === null) return;

  await supabaseClient
  .from("inventory")
  .update({

    name:newName,

    qty:Number(newQty),

    unit:newUnit,

    price:Number(newPrice)

  })
  .eq("id",item.id);

  await loadInventory();

}

/* ========================= */
/* QR SCANNER */
/* ========================= */

function startScanner(){

  if(scannerRunning){

    return;
  }

  scannerRunning = true;

  const scanner =
    new Html5Qrcode("reader");

  scanner.start(

    { facingMode:"environment" },

    {

      fps:30,

      qrbox:{
        width:300,
        height:300
      },

      aspectRatio:1.0,

      disableFlip:false

    },

    async(text)=>{

      try{

        const decoded =
          decodeURIComponent(text);

        const data =
          JSON.parse(decoded);

        const name =
          data.name;

        const qty =
          Number(data.qty);

        const unit =
          data.unit;

        const price =
          Number(data.price);

        if(!name){

          alert(
            "❌ Неверный QR"
          );

          scanner.stop();

          scannerRunning = false;

          return;
        }

        const currentState =
          JSON.stringify({

            qty,
            unit,
            price

          });

        if(
          lastQrState[name] ===
          currentState
        ){

          alert(
            "⚠️ Изменений нет"
          );

          scanner.stop();

          scannerRunning = false;

          return;
        }

        lastQrState[name] =
          currentState;

        const existing =
          inventory.find(
            i=>i.name===name
          );

        if(existing){

          await supabaseClient
          .from("inventory")
          .update({

            qty:qty,

            unit:unit,

            price:price

          })
          .eq("id",existing.id);

        }else{

          await supabaseClient
          .from("inventory")
          .insert({

            user_id:user.id,

            name:name,

            qty:qty,

            unit:unit,

            price:price

          });

        }

        await loadInventory();

        scanner.stop();

        scannerRunning = false;

        alert(
          "✅ QR обновлён"
        );

      }catch(e){

        alert(
          "❌ Ошибка QR-кода"
        );

        scanner.stop();

        scannerRunning = false;

      }

    }

  ).catch(()=>{

    alert(
      "Ошибка камеры"
    );

    scannerRunning = false;

  });

}

/* ========================= */
/* SHARE QR */
/* ========================= */

async function shareQR(index){

  const container =
    document.getElementById(
      `qr-${index}`
    );

  const img =
    container.querySelector("img");

  if(!img){

    alert(
      "QR еще не создан"
    );

    return;
  }

  try{

    const response =
      await fetch(img.src);

    const blob =
      await response.blob();

    const file =
      new File(

        [blob],

        `qr-${inventory[index].name}.png`,

        {
          type:"image/png"
        }

      );

    if(

      navigator.canShare &&

      navigator.canShare({

        files:[file]

      })

    ){

      await navigator.share({

        title:
          inventory[index].name,

        text:
          `QR товара: ${inventory[index].name}`,

        files:[file]

      });

    }else{

      const link =
        document.createElement("a");

      link.href = img.src;

      link.download =
        `qr-${inventory[index].name}.png`;

      link.click();

    }

  }catch(e){

    alert(
      "Ошибка отправки QR"
    );

  }

}

/* ========================= */
/* EXPORT EXCEL */
/* ========================= */

function exportExcel(){

  if(inventory.length === 0){

    alert(
      "Нет данных для Excel"
    );

    return;
  }

  const excelData =
    inventory.map(item=>({

      "Товар":
      item.name,

      "Остаток":
      item.qty,

      "Единица":
      item.unit,

      "Цена":
      Number(item.price),

      "Сумма":
      Number(item.qty) *
      Number(item.price)

    }));

  const worksheet =
    XLSX.utils.json_to_sheet(
      excelData
    );

  const workbook =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(

    workbook,

    worksheet,

    "Склад"

  );

  XLSX.writeFile(

    workbook,

    "Склад.xlsx"

  );

}

/* ========================= */
/* AUTO LOGIN */
/* ========================= */

async function autoLogin(){

  const { data } =
    await supabaseClient
    .auth
    .getUser();

  if(data.user){

    user = data.user;

    document.getElementById(
      "userEmail"
    ).textContent =
      user.email;

    openApp();

  }

}

autoLogin();

</script>

</body>
</html>
