<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Складской учет материалов</title>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    .form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      border: none;
      cursor: pointer;
      background: #27ae60;
      color: white;
    }

    button:hover {
      background: #219150;
    }

    .delete-btn {
      background: #e74c3c;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    .scan-btn {
      background: #2980b9;
    }

    .scan-btn:hover {
      background: #21618c;
    }

    .print-btn {
      background: #8e44ad;
    }

    .print-btn:hover {
      background: #6c3483;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #34495e;
      color: white;
    }

    .summary {
      margin-top: 20px;
      text-align: right;
      font-size: 18px;
      font-weight: bold;
    }

    #reader {
      width: 300px;
      margin: 20px auto;
    }

    svg {
      width: 180px;
      height: 60px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📦 Складской учет материалов</h1>

    <div class="form">
      <input type="text" id="material" placeholder="Материал">
      <input type="number" id="quantity" placeholder="Количество">
      <input type="text" id="unit" placeholder="Единица">
      <input type="number" id="price" placeholder="Цена за единицу">
      <button onclick="addMaterial()">Добавить</button>
      <button class="scan-btn" onclick="startScanner()">📷 Сканировать</button>
    </div>

    <div id="reader"></div>

    <table>
      <thead>
        <tr>
          <th>Материал</th>
          <th>Количество</th>
          <th>Единица</th>
          <th>Цена</th>
          <th>Сумма</th>
          <th>Штрих-код</th>
          <th>Печать</th>
          <th>Удалить</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="summary" id="total">Общая стоимость: 0 ₴</div>
  </div>

  <script>
    let materials = JSON.parse(localStorage.getItem('materials')) || [];

    function saveMaterials() {
      localStorage.setItem('materials', JSON.stringify(materials));
    }

    function generateBarcode() {
      return 'MAT-' + Math.floor(Math.random() * 1000000000);
    }

    function renderTable() {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      let total = 0;

      materials.forEach((item, index) => {
        const row = document.createElement('tr');
        const sum = item.quantity * item.price;
        total += sum;

        row.innerHTML = `
          <td>${item.material}</td>
          <td>${item.quantity}</td>
          <td>${item.unit}</td>
          <td>${item.price} ₴</td>
          <td>${sum} ₴</td>
          <td>
            <svg id="barcode-${index}"></svg>
            <div>${item.barcode}</div>
          </td>
          <td>
            <button class="print-btn" onclick="printBarcode(${index})">🖨 Печать</button>
          </td>
          <td>
            <button class="delete-btn" onclick="deleteMaterial(${index})">X</button>
          </td>
        `;

        tableBody.appendChild(row);

        JsBarcode(`#barcode-${index}`, item.barcode, {
          format: 'CODE128',
          displayValue: true
        });
      });

      document.getElementById('total').innerText = `Общая стоимость: ${total} ₴`;
    }

    function addMaterial() {
      const material = document.getElementById('material').value.trim();
      const quantity = parseFloat(document.getElementById('quantity').value);
      const unit = document.getElementById('unit').value.trim();
      const price = parseFloat(document.getElementById('price').value);

      if (!material || !quantity || !unit || isNaN(price)) {
        alert('Заполните все поля!');
        return;
      }

      const barcode = generateBarcode();

      materials.push({
        material,
        quantity,
        unit,
        price,
        barcode
      });

      saveMaterials();
      renderTable();

      document.getElementById('material').value = '';
      document.getElementById('quantity').value = '';
      document.getElementById('unit').value = '';
      document.getElementById('price').value = '';
    }

    function deleteMaterial(index) {
      materials.splice(index, 1);
      saveMaterials();
      renderTable();
    }

    function printBarcode(index) {
      const item = materials[index];

      const printWindow = window.open('', '', 'width=500,height=400');

      printWindow.document.write(`
        <html>
        <head>
          <title>Печать штрих-кода</title>
          <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
          <style>
            body {
              font-family: Arial, sans-serif;
              text-align: center;
              padding-top: 50px;
            }
          </style>
        </head>
        <body>
          <h2>${item.material}</h2>
          <svg id="print-barcode"></svg>
          <p>${item.barcode}</p>

          <script>
            JsBarcode('#print-barcode', '${item.barcode}', {
              format: 'CODE128',
              displayValue: true
            });

            window.onload = function() {
              window.print();
            }
          <\/script>
        </body>
        </html>
      `);

      printWindow.document.close();
    }

    function startScanner() {
      const scanner = new Html5Qrcode('reader');

      scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: 250
        },
        (decodedText) => {
          const item = materials.find(m => m.barcode === decodedText);

          if (item) {
            alert(`Найден материал: ${item.material}\nКоличество: ${item.quantity} ${item.unit}`);
          } else {
            alert('Материал не найден');
          }

          scanner.stop();
        },
        (errorMessage) => {
        }
      ).catch(err => {
        alert('Ошибка камеры: ' + err);
      });
    }

    renderTable();
  </script>
</body>
</html>
