<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Склад PRO Users</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
  font-family:Arial;
  margin:0;
  background:#f0f2f5;
}

.auth{
  max-width:400px;
  margin:80px auto;
  background:white;
  padding:20px;
  border-radius:15px;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
}

button{
  width:100%;
  padding:10px;
  border:none;
  margin-top:5px;
  border-radius:8px;
  color:white;
}

.loading{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.4);
  text-align:center;
  color:white;
  padding-top:20%;
}

.spinner{
  width:60px;
  height:60px;
  border:6px solid #eee;
  border-top:6px solid #3498db;
  border-radius:50%;
  margin:auto;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

.container{
  display:none;
  max-width:1200px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

</style>

</head>

<body>

<!-- AUTH -->
<div class="auth" id="authBox">

<h2>🔐 Вход</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Пароль">

<button style="background:#2ecc71;" onclick="signUp()">Регистрация</button>
<button style="background:#3498db;" onclick="signIn()">Войти</button>

</div>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>Загрузка...</p>
</div>

<!-- APP -->
<div class="container" id="app">

<h1>📦 Склад</h1>

<input id="name" placeholder="Название">
<input id="qty" type="number" placeholder="Остаток">
<input id="unit" placeholder="Ед">
<input id="price" type="number" placeholder="Цена">

<button onclick="addItem()" style="background:#2ecc71;">➕</button>
<button onclick="startScanner()" style="background:#3498db;">📷</button>

<table>

<thead>
<tr>
<th>Товар</th>
<th>Остаток</th>
<th>Цена</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

<script>

const supabase =
window.supabase.createClient(
  "https://zwoaxfrijvtfclzdodpf.supabase.co",
  "YOUR_KEY"
);

let userId = null;
let inventory = [];

function showLoading(v){
  document.getElementById("loading").style.display =
  v ? "block" : "none";
}

function showApp(){
  document.getElementById("authBox").style.display="none";
  document.getElementById("app").style.display="block";
}

/* AUTH */

async function signUp(){

  showLoading(true);

  const { error } =
  await supabase.auth.signUp({
    email:email.value,
    password:password.value
  });

  showLoading(false);

  if(error) alert(error.message);
  else alert("Создано");
}

async function signIn(){

  showLoading(true);

  const { data, error } =
  await supabase.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });

  showLoading(false);

  if(error){
    alert(error.message);
    return;
  }

  userId = data.user.id;

  await loadData();

  showApp();
}

/* LOAD DATA */

async function loadData(){

  const { data } =
  await supabase
  .from("inventory")
  .select("*")
  .eq("user_id", userId);

  inventory = data || [];

  render();
}

/* ADD */

async function addItem(){

  const item = {
    name:name.value,
    qty:+qty.value,
    unit:unit.value,
    price:+price.value,
    user_id:userId
  };

  await supabase
  .from("inventory")
  .insert(item);

  loadData();
}

/* RENDER */

function render(){

  table.innerHTML="";

  inventory.forEach(i=>{

    let tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${i.name}</td>
      <td>${i.qty} ${i.unit}</td>
      <td>${i.price}</td>
    `;

    table.appendChild(tr);

  });

}

/* INIT */

async function init(){

  const { data:{ user } } =
  await supabase.auth.getUser();

  if(user){

    userId=user.id;

    await loadData();

    showApp();

  }
}

init();

</script>

</body>
</html>
