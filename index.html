<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Склад Cloud</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f0f2f5}

.hidden{display:none!important}

.auth{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  width:300px;
}

input{
  width:100%;
  margin:5px 0;
  padding:10px;
}

button{
  width:100%;
  padding:10px;
  margin-top:5px;
  background:#3498db;
  color:white;
  border:none;
  cursor:pointer;
}

.container{
  max-width:1200px;
  margin:auto;
  background:white;
  padding:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
</style>

</head>

<body>

<!-- AUTH -->
<div id="auth" class="auth">
  <div class="card">
    <h3>Вход</h3>
    <input id="email" placeholder="email">
    <input id="password" type="password" placeholder="password">

    <button onclick="login()">Войти</button>
    <button onclick="register()">Регистрация</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="container">

<h2>📦 Склад</h2>

<button onclick="logout()">Выйти</button>

<hr>

<input id="name" placeholder="Название">
<input id="qty" type="number" placeholder="Количество">
<input id="unit" placeholder="Ед">
<input id="price" type="number" placeholder="Цена">

<button onclick="addItem()">Добавить в QR и Excel</button>

<table>
<thead>
<tr>
<th>Товар</th>
<th>Кол-во</th>
<th>Цена</th>
<th>Сумма</th>
<th>QR</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

</div>
</div>

<script>

const SUPABASE_URL = "https://zwoaxfrijvtfclzdodpf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3b2F4ZnJpanZ0ZmNsemRvZHBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMzg0MTksImV4cCI6MjA5MzgxNDQxOX0.L_D25KpKYGAsBg2pqM80H0RqgUOB1J_ZVI1X_J9nqAw";

let user = null;
let items = [];

/* ===== UI ===== */

function showAuth(){
  document.getElementById("auth").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
}

function showApp(){
  document.getElementById("auth").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
}

/* ===== AUTH ===== */

async function register(){

  const email = emailInput().value;
  const password = passInput().value;

  const res = await fetch(SUPABASE_URL+"/auth/v1/signup",{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({email,password})
  });

  alert("Проверь почту для входа");
}

async function login(){

  const email = emailInput().value;
  const password = passInput().value;

  const res = await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({email,password})
  });

  const data = await res.json();

  if(!data.access_token){
    alert("Ошибка входа");
    return;
  }

  user = data.user;
  showApp();
  loadItems();
}

/* ===== LOAD ===== */

async function loadItems(){

  const res = await fetch(
    SUPABASE_URL + "/rest/v1/items?user_id=eq."+user.id,
    {
      headers:{
        apikey:SUPABASE_KEY
      }
    }
  );

  items = await res.json();
  render();
}

/* ===== ADD ===== */

async function addItem(){

  const item = {
    user_id:user.id,
    name:val("name"),
    qty:Number(val("qty")),
    unit:val("unit"),
    price:Number(val("price"))
  };

  items.push(item);

  await fetch(SUPABASE_URL+"/rest/v1/items",{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify(item)
  });

  render();
}

/* ===== RENDER ===== */

function render(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  items.forEach(i=>{

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${i.name}</td>
      <td>${i.qty} ${i.unit}</td>
      <td>${i.price}</td>
      <td>${i.qty*i.price}</td>
      <td><div id="q${i.name}"></div></td>
    `;

    list.appendChild(tr);

    new QRCode(document.getElementById("q"+i.name),{
      text:JSON.stringify(i),
      width:80,
      height:80
    });

  });
}

/* ===== HELP ===== */

function val(id){
  return document.getElementById(id).value;
}

function emailInput(){
  return document.getElementById("email");
}

function passInput(){
  return document.getElementById("password");
}

function logout(){
  user=null;
  showAuth();
}

showAuth();

</script>

</body>
</html>
