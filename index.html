<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Materials App</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#eef2f7;
}

/* AUTH */
#auth{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  width:300px;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
}

/* APP */
#app{
  display:none;
  padding:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

button{
  padding:10px;
  margin-top:5px;
  width:100%;
}

</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
  <div class="card">

    <h3>Вход</h3>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="register()">Регистрация</button>
    <button onclick="login()">Войти</button>

  </div>
</div>

<!-- APP -->
<div id="app">

<h2>📦 Материалы</h2>

<button onclick="logout()">Выйти</button>

<br><br>

<input id="name" placeholder="Название">
<input id="qty" type="number" placeholder="Количество">
<input id="price" type="number" placeholder="Цена">

<button onclick="addItem()">Добавить</button>
<button onclick="exportExcel()">Excel</button>

<table>
<thead>
<tr>
<th>Название</th>
<th>Кол-во</th>
<th>Цена</th>
<th>Сумма</th>
<th>QR</th>
</tr>
</thead>

<tbody id="list"></tbody>

</table>

</div>

<script>

const SUPABASE_URL = "https://zwoaxfrijvtfclzdodpf.supabase.co";
const SUPABASE_KEY = "PASTE_KEY_HERE";

let user = null;
let items = [];

/* ================= AUTH ================= */

async function register(){

  await fetch(SUPABASE_URL+"/auth/v1/signup",{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      email:email.value,
      password:password.value
    })
  });

  alert("Регистрация OK");
}

async function login(){

  const res = await fetch(
    SUPABASE_URL+"/auth/v1/token?grant_type=password",
    {
      method:"POST",
      headers:{
        apikey:SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email:email.value,
        password:password.value
      })
    }
  );

  const data = await res.json();

  if(!data.access_token){
    alert("Ошибка входа");
    return;
  }

  const payload = JSON.parse(atob(data.access_token.split('.')[1]));

  user = {
    id: payload.sub,
    email: email.value
  };

  localStorage.setItem("token", data.access_token);
  localStorage.setItem("user", JSON.stringify(user));

  document.getElementById("auth").style.display="none";
  document.getElementById("app").style.display="block";

  loadItems();
}

/* ================= LOAD ================= */

async function loadItems(){

  const token = localStorage.getItem("token");

  const res = await fetch(
    SUPABASE_URL+"/rest/v1/items?user_id=eq."+user.id,
    {
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer "+token
      }
    }
  );

  items = await res.json();

  render();
}

/* ================= ADD ================= */

async function addItem(){

  const item = {
    name:name.value,
    qty:Number(qty.value),
    price:Number(price.value),
    user_id:user.id
  };

  items.push(item);

  render();

  const token = localStorage.getItem("token");

  await fetch(SUPABASE_URL+"/rest/v1/items",{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:"Bearer "+token,
      "Content-Type":"application/json"
    },
    body:JSON.stringify(item)
  });

}

/* ================= RENDER ================= */

function render(){

  list.innerHTML="";

  items.forEach((i,idx)=>{

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${i.name}</td>
      <td>${i.qty}</td>
      <td>${i.price}</td>
      <td>${i.qty*i.price}</td>
      <td><div id="qr${idx}"></div></td>
    `;

    list.appendChild(tr);

    new QRCode(document.getElementById("qr"+idx),{
      text:JSON.stringify(i),
      width:80,
      height:80
    });

  });

}

/* ================= EXCEL ================= */

function exportExcel(){

  const data = items.map(i=>({
    name:i.name,
    qty:i.qty,
    price:i.price,
    sum:i.qty*i.price
  }));

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb,ws,"data");

  XLSX.writeFile(wb,"materials.xlsx");
}

/* ================= LOGOUT ================= */

function logout(){

  localStorage.clear();
  location.reload();

}

/* ================= AUTO LOGIN ================= */

window.onload=()=>{

  const u = localStorage.getItem("user");
  const t = localStorage.getItem("token");

  if(u && t){

    user = JSON.parse(u);

    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="block";

    loadItems();

  }

}

</script>

</body>
</html>
