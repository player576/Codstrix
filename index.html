<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📦 Склад Cloud</title>

<style>

:root{
  --bg:#eef2f7;
  --card:#ffffff;
  --primary:#3498db;
  --success:#2ecc71;
  --danger:#e74c3c;
}

body{
  margin:0;
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:var(--bg);
}

.hidden{
  display:none !important;
}

/* ================= AUTH ================= */

#authScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  box-sizing:border-box;
}

.auth-card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 5px 25px rgba(0,0,0,0.1);
}

.auth-title{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:25px;
  color:#2c3e50;
}

.auth-input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-bottom:15px;
  font-size:15px;
}

.auth-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:10px;
}

.login-btn{
  background:var(--primary);
}

.register-btn{
  background:var(--success);
}

/* ================= APP ================= */

#appScreen{
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
  background:var(--card);
  border-radius:20px;
  padding:20px;
  box-shadow:0 4px 25px rgba(0,0,0,0.1);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
  flex-wrap:wrap;
}

h1{
  margin:0;
  color:#2c3e50;
}

.logout-btn{
  background:#2c3e50;
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* ================= FORM ================= */

.form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  margin-bottom:20px;
}

.form input{
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  outline:none;
}

.add-btn{
  background:var(--success);
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* ================= TABLE ================= */

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#34495e;
  color:white;
}

th,td{
  padding:14px;
  text-align:center;
  border-bottom:1px solid #eee;
}

.total-box{
  margin-top:20px;
  text-align:right;
  font-size:24px;
  font-weight:bold;
}

.delete-btn{
  background:var(--danger);
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

/* ================= LOADER ================= */

#loader{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.loader-circle{
  width:70px;
  height:70px;
  border:8px solid #eee;
  border-top:8px solid #3498db;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

</style>

</head>
<body>

<!-- ================= LOADER ================= -->

<div id="loader" class="hidden">

  <div class="loader-circle"></div>

</div>

<!-- ================= AUTH ================= -->

<div id="authScreen">

  <div class="auth-card">

    <div class="auth-title">
      📦 Склад Cloud
    </div>

    <input
      id="email"
      class="auth-input"
      type="email"
      placeholder="Почта">

    <input
      id="password"
      class="auth-input"
      type="password"
      placeholder="Пароль">

    <button
      class="auth-btn login-btn"
      onclick="login()">

      🔐 Войти

    </button>

    <button
      class="auth-btn register-btn"
      onclick="register()">

      📝 Регистрация

    </button>

  </div>

</div>

<!-- ================= APP ================= -->

<div id="appScreen" class="hidden">

  <div class="container">

    <div class="topbar">

      <h1>📦 Склад материалов</h1>

      <button
        class="logout-btn"
        onclick="logout()">

        🚪 Выйти

      </button>

    </div>

    <!-- FORM -->

    <div class="form">

      <input
        id="name"
        placeholder="Название">

      <input
        id="qty"
        type="number"
        placeholder="Количество">

      <input
        id="unit"
        placeholder="Единица">

      <input
        id="price"
        type="number"
        placeholder="Цена">

      <button
        class="add-btn"
        onclick="addItem()">

        ➕ Добавить

      </button>

    </div>

    <!-- TABLE -->

    <table>

      <thead>

        <tr>

          <th>Название</th>
          <th>Количество</th>
          <th>Цена</th>
          <th>Сумма</th>
          <th>Удалить</th>

        </tr>

      </thead>

      <tbody id="tableBody"></tbody>

    </table>

    <div class="total-box">

      💰 Итого:
      <span id="grandTotal">0</span> ₴

    </div>

  </div>

</div>

<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
'https://zwoaxfrijvtfclzdodpf.supabase.co';

const SUPABASE_KEY =
'ВСТАВЬ_СВОЙ_ANON_KEY';

/* ================= STATE ================= */

let user = null;
let items = [];

/* ================= LOADER ================= */

function showLoader(){

  document
  .getElementById('loader')
  .classList
  .remove('hidden');

}

function hideLoader(){

  document
  .getElementById('loader')
  .classList
  .add('hidden');

}

/* ================= REGISTER ================= */

async function register(){

  const email =
    document.getElementById('email')
    .value.trim();

  const password =
    document.getElementById('password')
    .value;

  if(!email || !password){

    alert('Введите почту и пароль');

    return;
  }

  showLoader();

  try{

    const response =
      await fetch(

        SUPABASE_URL +
        '/auth/v1/signup',

        {

          method:'POST',

          headers:{
            apikey:SUPABASE_KEY,
            'Content-Type':'application/json'
          },

          body:JSON.stringify({

            email,
            password

          })

        }

      );

    hideLoader();

    if(response.ok){

      alert('✅ Регистрация успешна');

    }else{

      alert('Ошибка регистрации');

    }

  }catch(e){

    console.log(e);

    hideLoader();

    alert('Ошибка регистрации');

  }

}

/* ================= LOGIN ================= */

async function login(){

  const email =
    document.getElementById('email')
    .value.trim();

  const password =
    document.getElementById('password')
    .value;

  if(!email || !password){

    alert('Введите данные');

    return;
  }

  showLoader();

  try{

    const response =
      await fetch(

        SUPABASE_URL +
        '/auth/v1/token?grant_type=password',

        {

          method:'POST',

          headers:{
            apikey:SUPABASE_KEY,
            'Content-Type':'application/json'
          },

          body:JSON.stringify({

            email,
            password

          })

        }

      );

    const data =
      await response.json();

    hideLoader();

    if(!data.access_token){

      alert('❌ Ошибка входа');

      return;
    }

    const payload =
      JSON.parse(

        atob(
          data.access_token
          .split('.')[1]
        )

      );

    user = {

      id:payload.sub,
      email

    };

    localStorage.setItem(
      'warehouse_user',
      JSON.stringify(user)
    );

    localStorage.setItem(
      'warehouse_token',
      data.access_token
    );

    openApp();

    loadItems();

  }catch(e){

    console.log(e);

    hideLoader();

    alert('Ошибка входа');

  }

}

/* ================= OPEN APP ================= */

function openApp(){

  document
  .getElementById('authScreen')
  .classList
  .add('hidden');

  document
  .getElementById('appScreen')
  .classList
  .remove('hidden');

}

/* ================= LOGOUT ================= */

function logout(){

  localStorage.removeItem(
    'warehouse_user'
  );

  localStorage.removeItem(
    'warehouse_token'
  );

  location.reload();

}

/* ================= LOAD ITEMS ================= */

async function loadItems(){

  try{

    const token =
      localStorage.getItem(
        'warehouse_token'
      );

    const response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/items?select=*',

        {

          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
            'Bearer ' + token
          }

        }

      );

    const data =
      await response.json();

    items =
      data.filter(
        item=>item.user_id === user.id
      );

    render();

  }catch(e){

    console.log(e);

  }

}

/* ================= SAVE ITEM ================= */

async function saveItem(item){

  try{

    const token =
      localStorage.getItem(
        'warehouse_token'
      );

    const response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/items',

        {

          method:'POST',

          headers:{

            apikey:SUPABASE_KEY,

            Authorization:
            'Bearer ' + token,

            'Content-Type':
            'application/json',

            Prefer:
            'return=representation'

          },

          body:JSON.stringify({

            user_id:user.id,

            name:item.name,

            qty:item.qty,

            unit:item.unit,

            price:item.price

          })

        }

      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        JSON.stringify(data)
      );

    }

    return data[0];

  }catch(e){

    console.log(e);

    alert('Ошибка сохранения');

  }

}

/* ================= ADD ITEM ================= */

async function addItem(){

  const nameInput =
    document.getElementById('name');

  const qtyInput =
    document.getElementById('qty');

  const unitInput =
    document.getElementById('unit');

  const priceInput =
    document.getElementById('price');

  const item = {

    name:
      nameInput.value.trim(),

    qty:
      Number(qtyInput.value),

    unit:
      unitInput.value.trim() || 'шт',

    price:
      Number(priceInput.value) || 0

  };

  if(!item.name){

    alert('Введите название');

    return;
  }

  if(isNaN(item.qty)){

    alert('Введите количество');

    return;
  }

  showLoader();

  const saved =
    await saveItem(item);

  hideLoader();

  if(!saved){

    return;
  }

  items.push(saved);

  render();

  nameInput.value = '';
  qtyInput.value = '';
  unitInput.value = '';
  priceInput.value = '';

  alert('✅ Материал добавлен');

}

/* ================= DELETE ================= */

async function deleteItem(id){

  try{

    const token =
      localStorage.getItem(
        'warehouse_token'
      );

    await fetch(

      SUPABASE_URL +
      '/rest/v1/items?id=eq.' + id,

      {

        method:'DELETE',

        headers:{

          apikey:SUPABASE_KEY,

          Authorization:
          'Bearer ' + token

        }

      }

    );

    items =
      items.filter(
        item=>item.id !== id
      );

    render();

  }catch(e){

    console.log(e);

  }

}

/* ================= RENDER ================= */

function render(){

  const tableBody =
    document.getElementById(
      'tableBody'
    );

  const grandTotal =
    document.getElementById(
      'grandTotal'
    );

  tableBody.innerHTML = '';

  let total = 0;

  items.forEach(item=>{

    const row =
      document.createElement('tr');

    const sum =
      Number(item.qty) *
      Number(item.price);

    total += sum;

    row.innerHTML = `

      <td>
        <strong>${item.name}</strong>
      </td>

      <td>
        ${item.qty} ${item.unit}
      </td>

      <td>
        ${Number(item.price).toFixed(2)} ₴
      </td>

      <td>
        <strong>
          ${sum.toFixed(2)} ₴
        </strong>
      </td>

      <td>

        <button
          class="delete-btn"
          onclick="deleteItem(${item.id})">

          🗑 Удалить

        </button>

      </td>

    `;

    tableBody.appendChild(row);

  });

  grandTotal.textContent =
    total.toFixed(2);

}

/* ================= AUTO LOGIN ================= */

window.onload = ()=>{

  const savedUser =
    localStorage.getItem(
      'warehouse_user'
    );

  const token =
    localStorage.getItem(
      'warehouse_token'
    );

  if(savedUser && token){

    user =
      JSON.parse(savedUser);

    openApp();

    loadItems();

  }

}

</script>

</body>
</html>
