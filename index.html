<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Складской учет материалов</title>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #2c3e50; font-size: 22px; }
    .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 25px; }
    input, button { padding: 12px; border-radius: 10px; border: 1px solid #dfe6e9; outline: none; font-size: 14px; }
    button { border: none; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; }
    .add-btn { background: #27ae60; }
    .scan-btn { background: #2980b9; }
    .share-btn { background: #0088cc; } /* Цвет Telegram/Мессенджеров */
    .print-btn { background: #8e44ad; }
    .delete-btn { background: #e74c3c; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; overflow: hidden; border-radius: 8px; }
    th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: center; }
    th { background: #34495e; color: white; font-weight: normal; font-size: 13px; }
    
    .barcode-container { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    canvas { max-width: 140px; height: auto; display: block; }
    
    .actions { display: flex; flex-direction: column; gap: 8px; }
    
    #reader { width: 100%; max-width: 350px; margin: 10px auto; border-radius: 10px; overflow: hidden; }
  </style>
</head>
<body>

<div class="container">
  <h1>📦 Мой Склад</h1>

  <div class="form">
    <input type="text" id="material" placeholder="Название">
    <input type="number" id="quantity" placeholder="Кол-во">
    <input type="text" id="unit" placeholder="Ед. изм.">
    <input type="number" id="price" placeholder="Цена ₴">
    <button class="add-btn" onclick="addMaterial()">➕ Добавить</button>
    <button class="scan-btn" onclick="startScanner()">📷 Камера</button>
  </div>

  <div id="reader"></div>

  <table>
    <thead>
      <tr>
        <th>Товар</th>
        <th>Остаток</th>
        <th>Цена</th>
        <th>Штрих-код</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
  let materials = JSON.parse(localStorage.getItem('materials')) || [];

  function saveMaterials() {
    localStorage.setItem('materials', JSON.stringify(materials));
  }

  function generateBarcode() {
    return Math.floor(100000000000 + Math.random() * 900000000000).toString();
  }

  function renderTable() {
    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '';

    materials.forEach((item, index) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><strong>${item.material}</strong></td>
        <td>${item.quantity} ${item.unit}</td>
        <td>${item.price} ₴</td>
        <td>
          <div class="barcode-container">
            <canvas id="barcode-${index}"></canvas>
            <small style="color:#7f8c8d">${item.barcode}</small>
          </div>
        </td>
        <td class="actions">
          <button class="share-btn" onclick="shareAsImage(${index})">📲 В мессенджер</button>
          <button class="print-btn" onclick="printBarcode(${index})">🖨 Печать</button>
          <button class="delete-btn" onclick="deleteMaterial(${index})">🗑</button>
        </td>
      `;
      tableBody.appendChild(row);

      // Генерация графики в Canvas
      JsBarcode(`#barcode-${index}`, item.barcode, {
        format: 'CODE128',
        displayValue: false,
        width: 2,
        height: 50,
        margin: 10
      });
    });
  }

  // ФУНКЦИЯ ОТПРАВКИ PNG ФАЙЛА
  async function shareAsImage(index) {
    const item = materials[index];
    const canvas = document.getElementById(`barcode-${index}`);
    
    // 1. Конвертируем Canvas в Blob (бинарные данные PNG)
    canvas.toBlob(async (blob) => {
      if (!blob) {
        alert("Ошибка создания изображения");
        return;
      }

      // 2. Создаем файл из Blob
      const file = new File([blob], `barcode-${item.barcode}.png`, { type: 'image/png' });

      // 3. Проверяем возможность отправки файла
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: `Штрих-код: ${item.material}`,
            text: `Товар: ${item.material}\nКод: ${item.barcode}`
          });
        } catch (err) {
          console.error("Пользователь отменил отправку или произошла ошибка:", err);
        }
      } else {
        // Запасной вариант: скачивание
        const link = document.createElement('a');
        link.href = canvas.toDataURL("image/png");
        link.download = `barcode-${item.material}.png`;
        link.click();
        alert("Ваш браузер не поддерживает прямую отправку файлов. PNG скачан в память устройства.");
      }
    }, 'image/png');
  }

  function addMaterial() {
    const material = document.getElementById('material').value;
    const quantity = document.getElementById('quantity').value;
    const unit = document.getElementById('unit').value;
    const price = document.getElementById('price').value;

    if (!material || !quantity || !price) return alert("Заполните поля!");

    materials.push({ material, quantity, unit, price, barcode: generateBarcode() });
    saveMaterials();
    renderTable();

    document.querySelectorAll('.form input').forEach(i => i.value = '');
  }

  function deleteMaterial(index) {
    if (confirm("Удалить позицию?")) {
      materials.splice(index, 1);
      saveMaterials();
      renderTable();
    }
  }

  function printBarcode(index) {
    const item = materials[index];
    const win = window.open('', '', 'width=400,height=400');
    win.document.write(`<html><body style="text-align:center;padding:20px;">
      <h2>${item.material}</h2>
      <canvas id="p"></canvas>
      <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script>
      <script>
        JsBarcode('#p', '${item.barcode}', {format:'CODE128', width:2, height:100, displayValue:true});
        setTimeout(() => { window.print(); window.close(); }, 500);
      <\/script>
    </body></html>`);
    win.document.close();
  }

  function startScanner() {
    const scanner = new Html5Qrcode('reader');
    scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, (text) => {
      const found = materials.find(m => m.barcode === text);
      alert(found ? `Найден: ${found.material}` : "Код не найден");
      scanner.stop();
    }).catch(e => alert("Ошибка камеры"));
  }

  renderTable();
</script>

</body>
</html>
