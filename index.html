<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📦 Sklad Cloud PRO</title>

<!-- LIBS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

/* ================= GLOBAL ================= */

body{
  margin:0;
  font-family:Arial;
  background:#eef2f7;
}

.hidden{display:none!important}

/* ================= LOADER ================= */

.loader-screen{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
}

.circle{
  width:60px;
  height:60px;
  border:6px solid #ddd;
  border-top:6px solid #3498db;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg)}
}

/* ================= AUTH ================= */

.auth-screen{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.auth-box{
  width:320px;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

.auth-box input{
  width:100%;
  padding:10px;
  margin:5px 0;
}

.auth-box button{
  width:100%;
  padding:10px;
  margin-top:5px;
  background:#3498db;
  color:#fff;
  border:none;
}

/* ================= APP ================= */

.app{
  padding:10px;
}

.container{
  max-width:1100px;
  margin:auto;
  background:#fff;
  padding:15px;
  border-radius:15px;
}

input{
  padding:10px;
  margin:5px;
}

/* ================= TABLE ================= */

table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}

th{
  background:#34495e;
  color:white;
}

</style>

</head>

<body>

<!-- ================= LOADER ================= -->

<div id="loader" class="loader-screen hidden">
  <div class="circle"></div>
</div>

<!-- ================= AUTH ================= -->

<div id="auth" class="auth-screen">

  <div class="auth-box">

    <h2>Вход</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Войти</button>
    <button onclick="register()">Регистрация</button>

  </div>

</div>

<!-- ================= APP ================= -->

<div id="app" class="hidden app">

  <div class="container">

    <h2>📦 Склад</h2>

    <input id="name" placeholder="Название">
    <input id="qty" placeholder="Кол-во">
    <input id="unit" placeholder="Ед">
    <input id="price" placeholder="Цена">

    <button onclick="addItem()">Добавить</button>
    <button onclick="logout()">Выйти</button>

    <table>

      <thead>
        <tr>
          <th>Товар</th>
          <th>Кол-во</th>
          <th>Цена</th>
          <th>Сумма</th>
        </tr>
      </thead>

      <tbody id="table"></tbody>

    </table>

  </div>

</div>

<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL = "https://zwoaxfrijvtfclzdodpf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3b2F4ZnJpanZ0ZmNsemRvZHBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMzg0MTksImV4cCI6MjA5MzgxNDQxOX0.L_D25KpKYGAsBg2pqM80H0RqgUOB1J_ZVI1X_J9nqAw";

/* ================= STATE ================= */

let user = null;
let items = [];

/* ================= LOADER ================= */

function showLoader(){
  document.getElementById("loader").classList.remove("hidden");
  setTimeout(()=>hideLoader(), 6000);
}

function hideLoader(){
  document.getElementById("loader").classList.add("hidden");
}

/* ================= START APP ================= */

window.onload = () => {
  start();
};

function start(){

  hideLoader();

  const saved = localStorage.getItem("user");

  if(!saved){
    return;
  }

  user = JSON.parse(saved);

  document.getElementById("auth").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  load();
}

/* ================= AUTH ================= */

async function register(){

  showLoader();

  const r = await fetch(SUPABASE_URL+"/auth/v1/signup",{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      email:email.value,
      password:password.value
    })
  });

  const d = await r.json();

  alert(d.user ? "OK" : "error");

  hideLoader();
}

async function login(){

  showLoader();

  const r = await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      email:email.value,
      password:password.value
    })
  });

  const d = await r.json();

  if(!d.access_token){
    alert("error");
    hideLoader();
    return;
  }

  const payload = JSON.parse(atob(d.access_token.split(".")[1]));

  user = {id:payload.sub};

  localStorage.setItem("user",JSON.stringify(user));

  document.getElementById("auth").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  load();

  hideLoader();
}

/* ================= DATA ================= */

async function load(){

  const r = await fetch(
    SUPABASE_URL+"/rest/v1/items?select=*",
    {headers:{apikey:SUPABASE_KEY}}
  );

  items = await r.json();

  render();
}

async function addItem(){

  const item = {
    name:name.value,
    qty:qty.value,
    unit:unit.value,
    price:price.value,
    user_id:user.id
  };

  items.push(item);

  render();

  await fetch(SUPABASE_URL+"/rest/v1/items",{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify(item)
  });

}

/* ================= RENDER ================= */

function render(){

  const t = document.getElementById("table");

  t.innerHTML = "";

  items.forEach(i=>{

    t.innerHTML += `
      <tr>
        <td>${i.name}</td>
        <td>${i.qty}</td>
        <td>${i.price}</td>
        <td>${i.qty*i.price}</td>
      </tr>
    `;

  });

}

/* ================= LOGOUT ================= */

function logout(){

  localStorage.removeItem("user");
  location.reload();

}

</script>

</body>
</html>
