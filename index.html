<!DOCTYPE html>    
<html lang="ru">    
<head>    
  <meta charset="UTF-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    
  <title>Складской учет PRO (QR + Excel)</title>    
    
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>    
  <script src="https://unpkg.com/html5-qrcode"></script>    
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>    
    
  <style>    
    /* твой CSS без изменений */    
  </style>    
</head>    
    
<body>    
    
<div class="container">    
    
  <h1>📦 Складской учет (QR + Excel)</h1>    
    
  <div class="form">    
    
    <input type="text" id="name" placeholder="Название">    
    <input type="number" id="qty" placeholder="Остаток">    
    <input type="text" id="unit" placeholder="Ед. (шт/кг)">    
    <input type="number" id="price" placeholder="Цена ₴">    
    
    <button class="btn-add" onclick="addItem()">➕ Добавить</button>    
    <button class="btn-scan" onclick="startScanner()">📷 Сканировать QR</button>    
    <button class="btn-excel" onclick="exportExcel()">📊 Excel</button>    
    
  </div>    
    
  <div id="reader"></div>    
    
  <table>    
    <thead>    
      <tr>    
        <th>Товар</th>    
        <th>Остаток</th>    
        <th>Цена</th>    
        <th>Сумма</th>    
        <th>QR-Код</th>    
        <th>Действия</th>    
      </tr>    
    </thead>    
    <tbody id="tableBody"></tbody>    
  </table>    
    
</div>    
    
<script>    
    
let inventory = JSON.parse(localStorage.getItem('my_inventory')) || [];    

// 🔥 ДОБАВЛЕНО: память последнего состояния QR
let lastScanMap = {};    

function save(){    
  localStorage.setItem('my_inventory', JSON.stringify(inventory));    
}    
    
function render(){    
  const tbody = document.getElementById('tableBody');    
  tbody.innerHTML = '';    
    
  inventory.forEach((item,index)=>{    
    
    const row = document.createElement('tr');    
    
    const qrData = encodeURIComponent(JSON.stringify(item));    
    
    row.innerHTML = `    
      <td>${item.name}</td>    
      <td>${item.qty} ${item.unit}</td>    
      <td>${item.price}</td>    
      <td>${item.qty * item.price}</td>    
      <td><div id="qr-${index}"></div></td>    
      <td>    
        <button onclick="editItem(${index})">✏️</button>    
        <button onclick="deleteItem(${index})">🗑</button>    
      </td>    
    `;    
    
    tbody.appendChild(row);    
    
    new QRCode(document.getElementById(`qr-${index}`),{    
      text: qrData,    
      width:180,    
      height:180,    
      colorDark:"#000",    
      colorLight:"#fff",    
      correctLevel:QRCode.CorrectLevel.H    
    });    
    
  });    
}    
    
function addItem(){    
    
  inventory.push({    
    name:document.getElementById('name').value,    
    qty:Number(document.getElementById('qty').value),    
    unit:document.getElementById('unit').value,    
    price:Number(document.getElementById('price').value)    
  });    
    
  save();    
  render();    
}    
    
// 🔥 ГЛАВНОЕ ИЗМЕНЕНИЕ (СКАНЕР)
function startScanner(){    
    
  const scanner = new Html5Qrcode("reader");    
    
  scanner.start(    
    { facingMode:"environment" },    
    { fps:30, qrbox:300 },    
    
    (text)=>{    
    
      try{    
    
        const data = JSON.parse(decodeURIComponent(text));    
    
        const key = data.name;    
    
        const newState = JSON.stringify(data);    
    
        const oldState = lastScanMap[key];    
    
        // ❗ ЕСЛИ НЕТ ИЗМЕНЕНИЙ — НЕ СКАНИРУЕМ
        if(oldState === newState){    
          alert("⚠️ QR без изменений — игнор");    
          scanner.stop();    
          return;    
        }    
    
        lastScanMap[key] = newState;    
    
        let existing = inventory.find(i=>i.name===data.name);    
    
        if(existing){    
    
          existing.qty = Number(data.qty);    
          existing.unit = data.unit;    
          existing.price = Number(data.price);    
    
        } else {    
    
          inventory.push(data);    
    
        }    
    
        save();    
        render();    
    
        scanner.stop();    
    
        alert("✅ QR обновлён");    
    
      }catch(e){    
        alert("❌ Ошибка QR");    
        scanner.stop();    
      }    
    
    }    
  );    
}    
    
function editItem(i){    
    
  let it = inventory[i];    
    
  it.name = prompt("Название", it.name);    
  it.qty = Number(prompt("Остаток", it.qty));    
  it.unit = prompt("Ед", it.unit);    
  it.price = Number(prompt("Цена", it.price));    
    
  save();    
  render();    
}    
    
function deleteItem(i){    
  inventory.splice(i,1);    
  save();    
  render();    
}    
    
function exportExcel(){    
    
  const data = inventory.map(i=>({    
    Товар:i.name,    
    Остаток:i.qty,    
    Ед:i.unit,    
    Цена:i.price,    
    Сумма:i.qty*i.price    
  }));    
    
  const ws = XLSX.utils.json_to_sheet(data);    
  const wb = XLSX.utils.book_new();    
    
  XLSX.utils.book_append_sheet(wb,ws,"Склад");    
  XLSX.writeFile(wb,"sklad.xlsx");    
}    
    
render();    
    
</script>    
    
</body>    
</html>
