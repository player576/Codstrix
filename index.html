<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Складской учет PRO (QR-Sync)</title>

  <!-- QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Сканер -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    :root{
      --bg:#f0f2f5;
      --card:#ffffff;
      --primary:#3498db;
      --success:#2ecc71;
      --danger:#e74c3c;
    }

    body{
      font-family:'Segoe UI',Tahoma,sans-serif;
      background:var(--bg);
      margin:0;
      padding:10px;
    }

    .container{
      max-width:1200px;
      margin:auto;
      background:var(--card);
      padding:20px;
      border-radius:15px;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
      overflow-x:auto;
    }

    h1{
      text-align:center;
      color:#2c3e50;
      margin-bottom:20px;
    }

    .form{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
      gap:10px;
      margin-bottom:20px;
    }

    input{
      padding:12px;
      border:1px solid #ddd;
      border-radius:8px;
      outline:none;
      font-size:14px;
    }

    button{
      padding:10px;
      border:none;
      border-radius:8px;
      color:white;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      opacity:0.9;
    }

    .btn-add{
      background:var(--success);
    }

    .btn-scan{
      background:var(--primary);
    }

    .btn-share{
      background:#1da1f2;
      font-size:12px;
    }

    .btn-del{
      background:var(--danger);
      font-size:12px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
      min-width:950px;
    }

    th,td{
      padding:12px;
      border-bottom:1px solid #eee;
      text-align:center;
      vertical-align:middle;
    }

    th{
      background:#34495e;
      color:white;
    }

    .qr-container{
      display:flex;
      justify-content:center;
      align-items:center;
      min-width:110px;
      min-height:110px;
    }

    .qr-container img{
      width:100px;
      height:100px;
    }

    .actions{
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:center;
    }

    #reader{
      width:100%;
      max-width:400px;
      margin:15px auto;
      border-radius:12px;
      overflow:hidden;
    }

    .total-box{
      margin-top:20px;
      text-align:right;
      font-size:22px;
      font-weight:bold;
      color:#2c3e50;
    }

    @media(max-width:768px){

      table{
        font-size:13px;
      }

      th,td{
        padding:8px;
      }

      .qr-container img{
        width:80px;
        height:80px;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <h1>📦 Складской учет (QR-Версия)</h1>

  <div class="form">

    <input
      type="text"
      id="name"
      placeholder="Название">

    <input
      type="number"
      id="qty"
      placeholder="Кол-во">

    <input
      type="text"
      id="unit"
      placeholder="Ед. (шт/кг)">

    <input
      type="number"
      id="price"
      placeholder="Цена ₴">

    <button
      class="btn-add"
      onclick="addItem()">
      ➕ Добавить
    </button>

    <button
      class="btn-scan"
      onclick="startScanner()">
      📷 Сканировать QR
    </button>

  </div>

  <div id="reader"></div>

  <table>

    <thead>
      <tr>
        <th>Товар</th>
        <th>Остаток</th>
        <th>Цена</th>
        <th>Сумма</th>
        <th>QR-Код</th>
        <th>Действия</th>
      </tr>
    </thead>

    <tbody id="tableBody"></tbody>

  </table>

  <div class="total-box">
    💰 Общая сумма:
    <span id="grandTotal">0</span> ₴
  </div>

</div>

<script>

let inventory =
  JSON.parse(
    localStorage.getItem('my_inventory')
  ) || [];

function save(){

  localStorage.setItem(
    'my_inventory',
    JSON.stringify(inventory)
  );
}

function render(){

  const tbody =
    document.getElementById('tableBody');

  const grandTotal =
    document.getElementById('grandTotal');

  tbody.innerHTML = '';

  let totalSum = 0;

  inventory.forEach((item,index)=>{

    const row =
      document.createElement('tr');

    // ✅ UTF-8 QR
    const qrData = encodeURIComponent(
      `SKLAD:${item.name}|${item.unit}|${item.price}`
    );

    const itemSum =
      Number(item.qty) * Number(item.price);

    totalSum += itemSum;

    row.innerHTML = `

      <td>
        <strong>${item.name}</strong>
      </td>

      <td>
        ${item.qty} ${item.unit}
      </td>

      <td>
        ${item.price} ₴
      </td>

      <td>
        <strong>${itemSum.toFixed(2)} ₴</strong>
      </td>

      <td class="qr-container">
        <div id="qr-${index}"></div>
      </td>

      <td>
        <div class="actions">

          <button
            class="btn-share"
            onclick="shareQR(${index})">

            📲 Переслать

          </button>

          <button
            class="btn-del"
            onclick="deleteItem(${index})">

            🗑 Удалить

          </button>

        </div>
      </td>
    `;

    tbody.appendChild(row);

    const qrElement =
      document.getElementById(`qr-${index}`);

    qrElement.innerHTML = '';

    new QRCode(qrElement,{
      text:qrData,
      width:100,
      height:100
    });

  });

  grandTotal.textContent =
    totalSum.toFixed(2);
}

function addItem(){

  const name =
    document.getElementById('name')
    .value.trim();

  const qty =
    parseFloat(
      document.getElementById('qty').value
    );

  const unit =
    document.getElementById('unit')
    .value.trim() || 'шт';

  const price =
    parseFloat(
      document.getElementById('price').value
    ) || 0;

  if(!name || isNaN(qty)){

    alert(
      "Введите название и количество!"
    );

    return;
  }

  inventory.push({
    name,
    qty,
    unit,
    price
  });

  save();

  render();

  ['name','qty','unit','price']
  .forEach(id=>{

    document.getElementById(id).value='';
  });
}

function startScanner(){

  const scanner =
    new Html5Qrcode('reader');

  scanner.start(

    { facingMode:'environment' },

    {
      fps:10,
      qrbox:250
    },

    (text)=>{

      // ✅ Декодируем UTF-8
      text = decodeURIComponent(text);

      if(text.startsWith("SKLAD:")){

        const data =
          text.replace(
            "SKLAD:",
            ""
          ).split('|');

        const name = data[0];
        const unit = data[1];
        const price =
          Number(data[2]);

        const existing =
          inventory.find(
            i=>i.name===name
          );

        if(existing){

          let add =
            prompt(
              `Товар "${name}" найден. Сколько добавить?`,
              "1"
            );

          if(add){

            existing.qty +=
              parseFloat(add);
          }

        }else{

          let qty =
            parseFloat(
              prompt(
                `Новый товар: ${name}. Количество:`,
                "1"
              )
            ) || 1;

          inventory.push({
            name,
            qty,
            unit,
            price
          });
        }

        save();

        render();

        scanner.stop();

        alert("✅ Готово!");

      }else{

        alert(
          "❌ Это не QR склада!"
        );

        scanner.stop();
      }
    }

  ).catch(()=>{

    alert("Ошибка камеры");
  });
}

async function shareQR(index){

  const container =
    document.getElementById(
      `qr-${index}`
    );

  const img =
    container.querySelector('img');

  if(!img){

    alert(
      "QR еще не создан"
    );

    return;
  }

  try{

    const response =
      await fetch(img.src);

    const blob =
      await response.blob();

    const file =
      new File(
        [blob],
        `qr-${inventory[index].name}.png`,
        {
          type:'image/png'
        }
      );

    if(
      navigator.canShare &&
      navigator.canShare({
        files:[file]
      })
    ){

      await navigator.share({

        title:
          inventory[index].name,

        text:
          `QR товара: ${inventory[index].name}`,

        files:[file]
      });

    }else{

      const link =
        document.createElement('a');

      link.href = img.src;

      link.download =
        `qr-${inventory[index].name}.png`;

      link.click();
    }

  }catch(e){

    alert(
      "Ошибка отправки QR"
    );
  }
}

function deleteItem(index){

  if(confirm('Удалить товар?')){

    inventory.splice(index,1);

    save();

    render();
  }
}

render();

</script>

</body>
</html>
