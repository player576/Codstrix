<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📦 Склад Cloud</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#eef2f7;
}

.hidden{display:none}

/* AUTH */
#auth{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  width:300px;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
}

/* APP */
#app{
  padding:20px;
}

table{
  width:100%;
  background:white;
  border-collapse:collapse;
}

td,th{
  padding:10px;
  border:1px solid #ddd;
  text-align:center;
}

button{
  padding:8px;
  cursor:pointer;
}

.add{
  background:#2ecc71;
  color:white;
  border:none;
}

.del{
  background:#e74c3c;
  color:white;
  border:none;
}

.qr img{
  width:80px;
}

</style>

</head>
<body>

<!-- AUTH -->
<div id="auth">

  <div class="card">

    <h3>Вход</h3>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">

    <button onclick="login()">Войти</button>
    <button onclick="register()">Регистрация</button>

  </div>

</div>

<!-- APP -->
<div id="app" class="hidden">

<h2>📦 Склад</h2>

<button onclick="logout()">Выход</button>

<br><br>

<input id="name" placeholder="Название">
<input id="qty" placeholder="Кол-во" type="number">
<input id="unit" placeholder="Ед">
<input id="price" placeholder="Цена" type="number">

<button class="add" onclick="add()">Добавить</button>

<br><br>

<table>

<thead>

<tr>
<th>Название</th>
<th>Кол-во</th>
<th>Цена</th>
<th>QR</th>
<th>Удалить</th>
</tr>

</thead>

<tbody id="t"></tbody>

</table>

</div>

<script>

const URL="https://zwoaxfrijvtfclzdodpf.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3b2F4ZnJpanZ0ZmNsemRvZHBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMzg0MTksImV4cCI6MjA5MzgxNDQxOX0.L_D25KpKYGAsBg2pqM80H0RqgUOB1J_ZVI1X_J9nqAw";

let user=null;
let items=[];

/* AUTH */

async function register(){

  await fetch(URL+"/auth/v1/signup",{
    method:"POST",
    headers:{
      apikey:KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      email:email.value,
      password:password.value
    })
  });

  alert("OK");
}

async function login(){

  let r=await fetch(URL+"/auth/v1/token?grant_type=password",{
    method:"POST",
    headers:{
      apikey:KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      email:email.value,
      password:password.value
    })
  });

  let d=await r.json();

  if(!d.access_token){
    alert("Ошибка");
    return;
  }

  user = JSON.parse(atob(d.access_token.split(".")[1]));

  localStorage.setItem("t",d.access_token);

  auth.classList.add("hidden");
  app.classList.remove("hidden");

  load();

}

/* LOAD */

async function load(){

  let t=localStorage.getItem("t");

  let r=await fetch(URL+"/rest/v1/items?select=*",
  {
    headers:{
      apikey:KEY,
      Authorization:"Bearer "+t
    }
  });

  let d=await r.json();

  items=d.filter(i=>i.user_id==user.sub);

  render();

}

/* ADD */

async function add(){

  let t=localStorage.getItem("t");

  let item={
    name:name.value,
    qty:+qty.value,
    unit:unit.value,
    price:+price.value,
    user_id:user.sub
  };

  let r=await fetch(URL+"/rest/v1/items",{
    method:"POST",
    headers:{
      apikey:KEY,
      Authorization:"Bearer "+t,
      "Content-Type":"application/json",
      Prefer:"return=representation"
    },
    body:JSON.stringify(item)
  });

  let d=await r.json();

  items.push(d[0]);

  render();

}

/* DELETE */

async function del(id){

  let t=localStorage.getItem("t");

  await fetch(URL+"/rest/v1/items?id=eq."+id,{
    method:"DELETE",
    headers:{
      apikey:KEY,
      Authorization:"Bearer "+t
    }
  });

  items=items.filter(i=>i.id!=id);

  render();

}

/* RENDER */

function render(){

  t.innerHTML="";

  items.forEach(i=>{

    let tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${i.name}</td>
      <td>${i.qty} ${i.unit}</td>
      <td>${i.price}</td>
      <td class="qr"></td>
      <td><button class="del" onclick="del(${i.id})">X</button></td>
    `;

    t.appendChild(tr);

    let qr=tr.querySelector(".qr");

    new QRCode(qr,{
      text:JSON.stringify(i),
      width:80,
      height:80
    });

  });

}

/* LOGOUT */

function logout(){
  localStorage.clear();
  location.reload();
}

</script>

</body>
</html>
