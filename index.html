<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Склад PRO + Users</title>

<!-- QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
  font-family:Arial;
  background:#f0f2f5;
  margin:0;
  padding:10px;
}

.container{
  max-width:1200px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  display:none;
}

h1{text-align:center;}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.auth{
  max-width:400px;
  margin:50px auto;
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.loading{
  display:none;
  text-align:center;
  margin-top:50px;
}

.spinner{
  width:50px;
  height:50px;
  border:6px solid #eee;
  border-top:6px solid #3498db;
  border-radius:50%;
  margin:auto;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:5px;
}

</style>

</head>

<body>

<!-- LOGIN -->
<div class="auth" id="authBox">

<h2>🔐 Вход</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Пароль">

<button style="background:#2ecc71;width:100%;" onclick="signUp()">Регистрация</button>
<button style="background:#3498db;width:100%;margin-top:10px;" onclick="signIn()">Войти</button>

</div>

<!-- LOADING -->
<div class="loading" id="loading">
<div class="spinner"></div>
<p>Загрузка...</p>
</div>

<!-- USER -->
<div style="text-align:center;display:none;" id="userPanel">
  <p id="userEmail"></p>
  <button style="background:#e74c3c;" onclick="logout()">Выйти</button>
</div>

<!-- APP -->
<div class="container">

<h1>📦 Склад</h1>

<input id="name" placeholder="Название">
<input id="qty" type="number" placeholder="Остаток">
<input id="unit" placeholder="Ед">
<input id="price" type="number" placeholder="Цена">

<button style="background:#2ecc71;" onclick="addItem()">➕ Добавить</button>
<button style="background:#3498db;" onclick="startScanner()">📷 Скан</button>
<button style="background:#27ae60;" onclick="exportExcel()">📊 Excel</button>

<div id="reader"></div>

<table>

<thead>
<tr>
<th>Товар</th>
<th>Остаток</th>
<th>Цена</th>
<th>Сумма</th>
<th>QR</th>
<th>Действия</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

<h3>💰 Итого: <span id="total">0</span> ₴</h3>

</div>

<script>

const supabase = window.supabase.createClient(
  "https://zwoaxfrijvtfclzdodpf.supabase.co",
  "YOUR_KEY"
);

let inventory = JSON.parse(localStorage.getItem("inv")) || [];

let lastQR = "";

function showLoading(v){
  document.getElementById("loading").style.display = v?"block":"none";
  document.getElementById("authBox").style.display = v?"none":"block";
}

function showApp(){
  document.getElementById("authBox").style.display="none";
  document.querySelector(".container").style.display="block";
  document.getElementById("userPanel").style.display="block";
}

async function signUp(){
  showLoading(true);

  const { error } = await supabase.auth.signUp({
    email:email.value,
    password:password.value
  });

  showLoading(false);

  if(error) alert(error.message);
  else alert("Готово! Теперь войди");
}

async function signIn(){
  showLoading(true);

  const { error } = await supabase.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });

  showLoading(false);

  if(error){
    alert(error.message);
    return;
  }

  checkUser();
}

async function checkUser(){

  const { data:{ user } } = await supabase.auth.getUser();

  if(user){
    document.getElementById("userEmail").innerText = "👤 "+user.email;
    showApp();
  }
}

async function logout(){
  await supabase.auth.signOut();
  location.reload();
}

/* -------- INVENTORY -------- */

function save(){
  localStorage.setItem("inv",JSON.stringify(inventory));
}

function render(){

  let t = 0;
  tableBody.innerHTML="";

  inventory.forEach((i,idx)=>{

    let sum = i.qty*i.price;
    t+=sum;

    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${i.name}</td>
      <td>${i.qty} ${i.unit}</td>
      <td>${i.price}</td>
      <td>${sum}</td>
      <td><div id="qr${idx}"></div></td>
      <td class="actions">
        <button onclick="edit(${idx})">✏️</button>
        <button onclick="del(${idx})">🗑</button>
      </td>
    `;

    tableBody.appendChild(tr);

    new QRCode(document.getElementById("qr"+idx),{
      text:JSON.stringify(i),
      width:120,
      height:120
    });

  });

  total.innerText = t;
}

function addItem(){

  inventory.push({
    name:name.value,
    qty:+qty.value,
    unit:unit.value,
    price:+price.value
  });

  save();
  render();
}

function edit(i){
  inventory[i].qty = prompt("Новый остаток",inventory[i].qty);
  save();
  render();
}

function del(i){
  inventory.splice(i,1);
  save();
  render();
}

/* SCANNER */

function startScanner(){

  let scanner = new Html5Qrcode("reader");

  scanner.start({facingMode:"environment"},{fps:20,qrbox:250},text=>{

    if(text===lastQR) return;

    lastQR=text;

    let d=JSON.parse(text);

    let ex=inventory.find(i=>i.name==d.name);

    if(ex) ex.qty+=d.qty;
    else inventory.push(d);

    save();
    render();

  });

}

/* EXCEL */

function exportExcel(){

  let ws = XLSX.utils.json_to_sheet(inventory);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"data");
  XLSX.writeFile(wb,"stock.xlsx");
}

/* INIT */

checkUser();
render();

</script>

</body>
</html>
