<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Склад PRO Cloud FIX</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
  margin:0;
  font-family:Segoe UI;
  background:#eef2f7;
}

/* AUTH */
.auth{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  width:320px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:10px;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.login{background:#3498db}
.register{background:#2ecc71}

/* LOADER */
.loader{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.8);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.circle{
  width:60px;
  height:60px;
  border:6px solid #ddd;
  border-top:6px solid #3498db;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

/* APP */
.container{
  max-width:1100px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:15px;
}

.form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
}

.add{background:#2ecc71}
.scan{background:#3498db}
.excel{background:#27ae60}
.logout{background:#2c3e50}

/* TABLE */
table{
  width:100%;
  margin-top:15px;
  border-collapse:collapse;
}

th{
  background:#34495e;
  color:white;
  padding:10px;
}

td{
  text-align:center;
  padding:10px;
  border-bottom:1px solid #eee;
}

/* QR */
.qr img{width:90px}

/* hidden */
.hidden{display:none!important}

</style>
</head>

<body>

<!-- LOADER -->
<div id="loader" class="loader hidden">
  <div class="circle"></div>
</div>

<!-- AUTH -->
<div id="auth" class="auth">
  <div class="card">

    <h3>📦 Склад PRO FIX anon</h3>

    <input id="email" placeholder="Почта">
    <input id="password" type="password" placeholder="Пароль">

    <button class="login" onclick="login()">Войти</button>
    <button class="register" onclick="register()">Регистрация</button>

  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="container">

<button class="logout" onclick="logout()">Выйти</button>

<h2>📦 Ваш склад</h2>

<div class="form">

<input id="name" placeholder="Название">
<input id="qty" type="number" placeholder="Остаток">
<input id="unit" placeholder="Ед">
<input id="price" type="number" placeholder="Цена">

<button class="add" onclick="addItem()">➕ Добавить</button>
<button class="scan" onclick="startScan()">📷 QR</button>
<button class="excel" onclick="exportExcel()">📊 Excel</button>

</div>

<div id="reader"></div>

<table>
<thead>
<tr>
<th>Товар</th>
<th>Остаток</th>
<th>Цена</th>
<th>Сумма</th>
<th>QR</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>

<h3>💰 Итого: <span id="total">0</span> ₴</h3>

</div>
</div>

<script>

/* SUPABASE */
const SUPABASE_URL = "https://zwoaxfrijvtfclzdodpf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3b2F4ZnJpanZ0ZmNsemRvZHBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMzg0MTksImV4cCI6MjA5MzgxNDQxOX0.L_D25KpKYGAsBg2pqM80H0RqgUOB1J_ZVI1X_J9nqAw";

let user = null;
let items = [];
let lastQR = {};

/* LOADER */
function show(v){
  document.getElementById('loader')
  .classList.toggle('hidden', !v);
}

/* REGISTER */
async function register(){

  show(true);

  await fetch(SUPABASE_URL+"/auth/v1/signup",{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      email:email.value.trim(),
      password:password.value
    })
  });

  show(false);

  alert("Регистрация отправлена");
}

/* LOGIN FIX */
async function login(){

  show(true);

  const res = await fetch(
    SUPABASE_URL+"/auth/v1/token?grant_type=password",
    {
      method:"POST",
      headers:{
        apikey:SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email:email.value.trim(),
        password:password.value
      })
    }
  );

  const data = await res.json();

  show(false);

  if(!data.access_token){
    alert("Ошибка входа");
    return;
  }

  user = data.user;

  localStorage.setItem("user", JSON.stringify(user));
  localStorage.setItem("token", data.access_token);

  auth.classList.add("hidden");
  app.classList.remove("hidden");

  loadItems();
}

/* LOAD FIX */
async function loadItems(){

  const token = localStorage.getItem("token");

  const res = await fetch(
    SUPABASE_URL+"/rest/v1/items?user_id=eq."+user.id,
    {
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer "+token
      }
    }
  );

  items = await res.json();

  render();
}

/* SAVE FIX */
async function save(item){

  const token = localStorage.getItem("token");

  await fetch(SUPABASE_URL+"/rest/v1/items",{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:"Bearer "+token,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      user_id:user.id,
      ...item
    })
  });

}

/* ADD FIX */
async function addItem(){

  const item = {
    name:name.value.trim(),
    qty:Number(qty.value),
    unit:unit.value || "шт",
    price:Number(price.value)
  };

  if(!item.name || isNaN(item.qty)){
    alert("Заполни поля!");
    return;
  }

  items.push(item);
  render();

  await save(item);

  name.value="";
  qty.value="";
  unit.value="";
  price.value="";
}

/* RENDER */
function render(){

  table.innerHTML = "";

  let sum = 0;

  items.forEach((i,idx)=>{

    sum += i.qty*i.price;

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${i.name}</td>
      <td>${i.qty} ${i.unit}</td>
      <td>${i.price}</td>
      <td>${i.qty*i.price}</td>
      <td><div id="qr${idx}"></div></td>
    `;

    table.appendChild(row);

    new QRCode(document.getElementById("qr"+idx),{
      text:JSON.stringify(i),
      width:90,
      height:90
    });

  });

  total.innerText = sum;
}

/* EXCEL FIX */
function exportExcel(){

  if(items.length === 0){
    alert("Нет данных");
    return;
  }

  const data = items.map(i=>({
    "Товар":i.name,
    "Остаток":i.qty,
    "Ед":i.unit,
    "Цена":i.price,
    "Сумма":i.qty*i.price
  }));

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb,ws,"Склад");

  XLSX.writeFile(wb,"склад.xlsx");
}

/* SCAN */
function startScan(){

  const scan = new Html5Qrcode("reader");

  scan.start(
    {facingMode:"environment"},
    {fps:10,qrbox:250},
    (text)=>{

      const data = JSON.parse(text);

      if(lastQR[data.name] === text){
        alert("Нет изменений");
        scan.stop();
        return;
      }

      lastQR[data.name] = text;

      items.push(data);

      render();

      scan.stop();

    }
  );
}

/* AUTO LOGIN FIX */
window.onload = ()=>{

  const saved = localStorage.getItem("user");
  const token = localStorage.getItem("token");

  if(saved && token){

    user = JSON.parse(saved);

    auth.classList.add("hidden");
    app.classList.remove("hidden");

    loadItems();

  }

};

function logout(){
  localStorage.clear();
  location.reload();
}

</script>

</body>
</html>
