<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Складской учет материалов</title>

  <!-- Библиотеки -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --primary: #2c3e50;
      --success: #27ae60;
      --info: #0088cc;
      --danger: #e74c3c;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: var(--primary); }
    .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; font-size: 24px; margin-bottom: 20px; }
    
    .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 25px; }
    input { padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; outline: none; }
    input:focus { border-color: var(--info); }
    
    button { padding: 12px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: 600; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    
    .add-btn { background: var(--success); }
    .scan-btn { background: var(--primary); }
    .share-btn { background: var(--info); }
    .print-btn { background: #8e44ad; }
    .delete-btn { background: var(--danger); padding: 5px 10px; }

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { background: #f8f9fa; padding: 12px; text-align: center; font-size: 13px; border-bottom: 2px solid #eee; }
    td { padding: 15px 10px; text-align: center; border-bottom: 1px solid #eee; }
    
    .barcode-box { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    canvas { max-width: 130px; height: auto; }
    
    .actions { display: flex; flex-direction: column; gap: 8px; }
    
    #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
    
    @media (max-width: 600px) {
      .form { grid-template-columns: 1fr 1fr; }
      .add-btn, .scan-btn { grid-column: span 2; }
      th:nth-child(3), td:nth-child(3) { display: none; } /* Скрываем ед. изм. на мобилках */
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📦 Складской учет</h1>

  <div class="form">
    <input type="text" id="material" placeholder="Название материала">
    <input type="number" id="quantity" placeholder="Количество">
    <input type="text" id="unit" placeholder="Ед. изм.">
    <input type="number" id="price" placeholder="Цена ₴">
    <button class="add-btn" onclick="addMaterial()">Добавить в базу</button>
    <button class="scan-btn" onclick="startScanner()">📷 Сканировать</button>
  </div>

  <div id="reader"></div>

  <table>
    <thead>
      <tr>
        <th>Материал</th>
        <th>Кол-во</th>
        <th>Цена</th>
        <th>Штрих-код</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
  let materials = JSON.parse(localStorage.getItem('materials')) || [];

  function saveMaterials() {
    localStorage.setItem('materials', JSON.stringify(materials));
  }

  function generateBarcode() {
    return Math.floor(100000000000 + Math.random() * 900000000000).toString();
  }

  function renderTable() {
    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '';

    materials.forEach((item, index) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><strong>${item.material}</strong></td>
        <td>${item.quantity} ${item.unit}</td>
        <td>${item.price} ₴</td>
        <td>
          <div class="barcode-box">
            <canvas id="barcode-${index}"></canvas>
            <small>${item.barcode}</small>
          </div>
        </td>
        <td class="actions">
          <button class="share-btn" onclick="shareAsImage(${index})">📲 Переслать PNG</button>
          <button class="print-btn" onclick="printBarcode(${index})">🖨 Печать</button>
          <button class="delete-btn" onclick="deleteMaterial(${index})">✕</button>
        </td>
      `;
      tableBody.appendChild(row);

      JsBarcode(`#barcode-${index}`, item.barcode, {
        format: 'CODE128',
        displayValue: false,
        width: 2,
        height: 50,
        margin: 10
      });
    });
  }

  // ГЛАВНАЯ ФУНКЦИЯ ОТПРАВКИ ИМЕННО КАРТИНКИ
  async function shareAsImage(index) {
    const item = materials[index];
    const canvas = document.getElementById(`barcode-${index}`);
    
    // Превращаем в PNG
    canvas.toBlob(async (blob) => {
      if (!blob) return;

      const fileName = `barcode-${item.barcode}.png`;
      const file = new File([blob], fileName, { type: 'image/png' });

      // Проверка на возможность отправки файлов (требуется HTTPS)
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          // Отправляем ТОЛЬКО файл, чтобы мессенджер не переключался на текст
          await navigator.share({
            files: [file]
          });
        } catch (err) {
          console.log("Отправка отменена");
        }
      } else {
        // Если пересылка не поддерживается браузером — скачиваем
        const link = document.createElement('a');
        link.href = canvas.toDataURL("image/png");
        link.download = fileName;
        link.click();
        alert("Браузер не смог открыть мессенджер. Штрих-код сохранен в Загрузки/Галерею.");
      }
    }, 'image/png');
  }

  function addMaterial() {
    const material = document.getElementById('material').value;
    const quantity = document.getElementById('quantity').value;
    const unit = document.getElementById('unit').value || 'шт';
    const price = document.getElementById('price').value;

    if (!material || !quantity || !price) return alert("Заполните название, количество и цену!");

    materials.push({ material, quantity, unit, price, barcode: generateBarcode() });
    saveMaterials();
    renderTable();

    // Очистка
    document.getElementById('material').value = '';
    document.getElementById('quantity').value = '';
    document.getElementById('price').value = '';
  }

  function deleteMaterial(index) {
    if (confirm("Удалить этот товар?")) {
      materials.splice(index, 1);
      saveMaterials();
      renderTable();
    }
  }

  function printBarcode(index) {
    const item = materials[index];
    const win = window.open('', '', 'width=400,height=400');
    win.document.write(`<html><body style="text-align:center;padding:40px;font-family:sans-serif;">
      <h3>${item.material}</h3>
      <canvas id="p"></canvas>
      <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script>
      <script>
        JsBarcode('#p', '${item.barcode}', {format:'CODE128', width:2, height:100, displayValue:true});
        setTimeout(() => { window.print(); window.close(); }, 500);
      <\/script>
    </body></html>`);
    win.document.close();
  }

  function startScanner() {
    const scanner = new Html5Qrcode('reader');
    scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, (text) => {
      const found = materials.find(m => m.barcode === text);
      if (found) {
        alert(`Найдено: ${found.material}\nОстаток: ${found.quantity} ${found.unit}`);
      } else {
        alert("Код " + text + " не найден в базе данных");
      }
      scanner.stop();
    }).catch(() => alert("Камера не найдена или доступ запрещен"));
  }

  renderTable();
</script>

</body>
</html>
