<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Складской учет материалов</title>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    .form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      border: none;
      cursor: pointer;
      color: white;
      background: #27ae60;
    }

    .scan-btn {
      background: #2980b9;
    }

    .print-btn {
      background: #8e44ad;
    }

    .delete-btn {
      background: #e74c3c;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #34495e;
      color: white;
    }

    #reader {
      width: 300px;
      margin: 20px auto;
    }

    canvas {
      max-width: 200px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📦 Складской учет материалов</h1>

  <div class="form">
    <input type="text" id="material" placeholder="Материал">
    <input type="number" id="quantity" placeholder="Количество">
    <input type="text" id="unit" placeholder="Единица">
    <input type="number" id="price" placeholder="Цена за единицу">
    <button onclick="addMaterial()">Добавить</button>
    <button class="scan-btn" onclick="startScanner()">📷 Сканировать</button>
  </div>

  <div id="reader"></div>

  <table>
    <thead>
      <tr>
        <th>Материал</th>
        <th>Количество</th>
        <th>Единица</th>
        <th>Цена</th>
        <th>Сумма</th>
        <th>Штрих-код</th>
        <th>Печать</th>
        <th>Удалить</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
  let materials = JSON.parse(localStorage.getItem('materials')) || [];

  function saveMaterials() {
    localStorage.setItem('materials', JSON.stringify(materials));
  }

  function generateBarcode() {
    return Math.floor(100000000000 + Math.random() * 900000000000).toString();
  }

  function renderTable() {
    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '';

    materials.forEach((item, index) => {
      const row = document.createElement('tr');
      const sum = item.quantity * item.price;

      row.innerHTML = `
        <td>${item.material}</td>
        <td>${item.quantity}</td>
        <td>${item.unit}</td>
        <td>${item.price} ₴</td>
        <td>${sum} ₴</td>
        <td>
          <canvas id="barcode-${index}"></canvas>
          <div>${item.barcode}</div>
        </td>
        <td>
          <button class="print-btn" onclick="printBarcode(${index})">🖨 Печать</button>
        </td>
        <td>
          <button class="delete-btn" onclick="deleteMaterial(${index})">X</button>
        </td>
      `;

      tableBody.appendChild(row);

      try {
        JsBarcode(`#barcode-${index}`, item.barcode, {
          format: 'CODE128',
          displayValue: false,
          width: 2,
          height: 50
        });
      } catch (e) {
        console.error('Ошибка штрих-кода:', e);
      }
    });
  }

  function addMaterial() {
    const material = document.getElementById('material').value.trim();
    const quantity = parseFloat(document.getElementById('quantity').value);
    const unit = document.getElementById('unit').value.trim();
    const price = parseFloat(document.getElementById('price').value);

    if (!material || isNaN(quantity) || !unit || isNaN(price)) {
      alert('Заполните все поля');
      return;
    }

    materials.push({
      material,
      quantity,
      unit,
      price,
      barcode: generateBarcode()
    });

    saveMaterials();
    renderTable();

    document.getElementById('material').value = '';
    document.getElementById('quantity').value = '';
    document.getElementById('unit').value = '';
    document.getElementById('price').value = '';
  }

  function deleteMaterial(index) {
    materials.splice(index, 1);
    saveMaterials();
    renderTable();
  }

  function printBarcode(index) {
    const item = materials[index];

    const win = window.open('', '', 'width=500,height=400');

    win.document.write(`
      <html>
      <head>
        <title>Печать</title>
        <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script>
      </head>
      <body style="font-family:Arial;text-align:center;padding-top:40px;">
        <h2>${item.material}</h2>
        <canvas id="printBarcode"></canvas>
        <p>${item.barcode}</p>

        <script>
          JsBarcode('#printBarcode', '${item.barcode}', {
            format:'CODE128',
            width:2,
            height:80,
            displayValue:true
          });

          setTimeout(() => {
            window.print();
          }, 500);
        <\/script>
      </body>
      </html>
    `);

    win.document.close();
  }

  function startScanner() {
    const scanner = new Html5Qrcode('reader');

    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 250 },
      (decodedText) => {
        const item = materials.find(m => m.barcode === decodedText);

        if (item) {
          alert(`Найден материал: ${item.material}`);
        } else {
          alert('Материал не найден');
        }

        scanner.stop();
      }
    ).catch(err => {
      alert('Ошибка камеры: ' + err);
    });
  }

  renderTable();
</script>
</body>
</html>
