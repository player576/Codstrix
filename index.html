<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📦 Склад PRO Cloud</title>

<!-- QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

:root{
  --bg:#eef2f7;
  --card:#ffffff;
  --primary:#3498db;
  --success:#2ecc71;
  --danger:#e74c3c;
  --orange:#f39c12;
}

body{
  margin:0;
  background:var(--bg);
  font-family:'Segoe UI',Tahoma,sans-serif;
}

/* ================= AUTH ================= */

#authScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  box-sizing:border-box;
}

.auth-card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 5px 25px rgba(0,0,0,0.12);
}

.auth-title{
  text-align:center;
  font-size:30px;
  margin-bottom:20px;
  color:#2c3e50;
  font-weight:bold;
}

.auth-input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-bottom:15px;
  font-size:15px;
}

.auth-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:10px;
}

.login-btn{
  background:#3498db;
}

.register-btn{
  background:#2ecc71;
}

/* ================= LOADER ================= */

.hidden{
  display:none !important;
}

#loader{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.circle{
  width:70px;
  height:70px;
  border:8px solid #eee;
  border-top:8px solid #3498db;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

/* ================= APP ================= */

#appScreen{
  padding:20px;
}

.container{
  max-width:1300px;
  margin:auto;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 4px 25px rgba(0,0,0,0.1);
  overflow-x:auto;
}

h1{
  text-align:center;
  color:#2c3e50;
}

.form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin-bottom:20px;
}

input{
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  outline:none;
}

button{
  border:none;
  border-radius:10px;
  padding:12px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  opacity:0.92;
}

.btn-add{
  background:#2ecc71;
}

.btn-scan{
  background:#3498db;
}

.btn-excel{
  background:#27ae60;
}

.btn-edit{
  background:#f39c12;
}

.btn-del{
  background:#e74c3c;
}

.btn-share{
  background:#1da1f2;
}

.btn-logout{
  background:#2c3e50;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th{
  background:#34495e;
  color:white;
}

th,td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid #eee;
}

.qr-container img{
  width:120px;
  height:120px;
  image-rendering:pixelated;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:6px;
}

#reader{
  width:100%;
  max-width:400px;
  margin:20px auto;
  border-radius:15px;
  overflow:hidden;
  border:3px solid #3498db;
}

.total-box{
  margin-top:20px;
  text-align:right;
  font-size:24px;
  font-weight:bold;
}

</style>

</head>
<body>

<!-- ================= LOADER ================= -->

<div id="loader" class="hidden">

  <div class="circle"></div>

</div>

<!-- ================= AUTH ================= -->

<div id="authScreen">

  <div class="auth-card">

    <div class="auth-title">
      📦 Склад Cloud
    </div>

    <input
      id="email"
      class="auth-input"
      type="email"
      placeholder="Почта">

    <input
      id="password"
      class="auth-input"
      type="password"
      placeholder="Пароль">

    <button
      class="auth-btn login-btn"
      onclick="login()">

      🔐 Войти

    </button>

    <button
      class="auth-btn register-btn"
      onclick="register()">

      📝 Регистрация

    </button>

  </div>

</div>

<!-- ================= APP ================= -->

<div id="appScreen" class="hidden">

<div class="container">

<button
  class="btn-logout"
  onclick="logout()">

  🚪 Выйти

</button>

<h1>📦 Складской учет</h1>

<div class="form">

<input id="name" placeholder="Название">

<input
  id="qty"
  type="number"
  placeholder="Количество">

<input
  id="unit"
  placeholder="Единица">

<input
  id="price"
  type="number"
  placeholder="Цена">

<button
  class="btn-add"
  onclick="addItem()">

  ➕ Добавить

</button>

<button
  class="btn-scan"
  onclick="startScanner()">

  📷 QR

</button>

<button
  class="btn-excel"
  onclick="exportExcel()">

  📊 Excel

</button>

</div>

<div id="reader"></div>

<table>

<thead>

<tr>

<th>Название</th>
<th>Количество</th>
<th>Цена</th>
<th>Сумма</th>
<th>QR</th>
<th>Действия</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

<div class="total-box">

💰 Итого:
<span id="grandTotal">0</span> ₴

</div>

</div>

</div>

<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
'https://zwoaxfrijvtfclzdodpf.supabase.co';

const SUPABASE_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3b2F4ZnJpanZ0ZmNsemRvZHBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMzg0MTksImV4cCI6MjA5MzgxNDQxOX0.L_D25KpKYGAsBg2pqM80H0RqgUOB1J_ZVI1X_J9nqAw';

/* ================= STATE ================= */

let user = null;
let items = [];
let lastQR = {};

/* ================= LOADER ================= */

function showLoader(){

  document
  .getElementById('loader')
  .classList
  .remove('hidden');

}

function hideLoader(){

  document
  .getElementById('loader')
  .classList
  .add('hidden');

}

/* ================= REGISTER ================= */

async function register(){

  const emailValue =
    document.getElementById('email')
    .value.trim();

  const passwordValue =
    document.getElementById('password')
    .value;

  if(!emailValue || !passwordValue){

    alert('Введите данные');

    return;
  }

  showLoader();

  try{

    const res =
      await fetch(

        SUPABASE_URL +
        '/auth/v1/signup',

        {

          method:'POST',

          headers:{
            apikey:SUPABASE_KEY,
            'Content-Type':'application/json'
          },

          body:JSON.stringify({

            email:emailValue,
            password:passwordValue

          })

        }

      );

    await res.json();

    hideLoader();

    alert('✅ Регистрация успешна');

  }catch(e){

    console.log(e);

    hideLoader();

    alert('Ошибка регистрации');

  }

}

/* ================= LOGIN ================= */

async function login(){

  const emailValue =
    document.getElementById('email')
    .value.trim();

  const passwordValue =
    document.getElementById('password')
    .value;

  if(!emailValue || !passwordValue){

    alert('Введите данные');

    return;
  }

  showLoader();

  try{

    const res =
      await fetch(

        SUPABASE_URL +
        '/auth/v1/token?grant_type=password',

        {

          method:'POST',

          headers:{
            apikey:SUPABASE_KEY,
            'Content-Type':'application/json'
          },

          body:JSON.stringify({

            email:emailValue,
            password:passwordValue

          })

        }

      );

    const data =
      await res.json();

    hideLoader();

    if(!data.access_token){

      alert('❌ Ошибка входа');

      return;
    }

    const payload =
      JSON.parse(

        atob(
          data.access_token
          .split('.')[1]
        )

      );

    user = {

      id:payload.sub,
      email:emailValue

    };

    localStorage.setItem(
      'warehouse_user',
      JSON.stringify(user)
    );

    localStorage.setItem(
      'warehouse_token',
      data.access_token
    );

    document
    .getElementById('authScreen')
    .classList
    .add('hidden');

    document
    .getElementById('appScreen')
    .classList
    .remove('hidden');

    loadItems();

  }catch(e){

    console.log(e);

    hideLoader();

    alert('Ошибка входа');

  }

}

/* ================= LOGOUT ================= */

function logout(){

  localStorage.removeItem(
    'warehouse_user'
  );

  localStorage.removeItem(
    'warehouse_token'
  );

  location.reload();

}

/* ================= LOAD ITEMS ================= */

async function loadItems(){

  try{

    const token =
      localStorage.getItem(
        'warehouse_token'
      );

    const res =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/items?user_id=eq.' +
        user.id,

        {

          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
            'Bearer ' + token
          }

        }

      );

    if(!res.ok){

      console.log(await res.text());

      items = [];

      render();

      return;
    }

    items =
      await res.json();

    render();

  }catch(e){

    console.log(e);

    items = [];

    render();

  }

}

/* ================= SAVE ITEM ================= */

async function saveItem(item){

  const token =
    localStorage.getItem(
      'warehouse_token'
    );

  const res =
    await fetch(

      SUPABASE_URL +
      '/rest/v1/items',

      {

        method:'POST',

        headers:{
          apikey:SUPABASE_KEY,
          Authorization:
          'Bearer ' + token,

          'Content-Type':
          'application/json',

          'Prefer':
          'return=minimal'
        },

        body:JSON.stringify({

          user_id:user.id,

          name:item.name,

          qty:item.qty,

          unit:item.unit,

          price:item.price

        })

      }

    );

  console.log(
    'SAVE STATUS:',
    res.status
  );

}

/* ================= ADD ITEM ================= */

async function addItem(){

  const nameInput =
    document.getElementById('name');

  const qtyInput =
    document.getElementById('qty');

  const unitInput =
    document.getElementById('unit');

  const priceInput =
    document.getElementById('price');

  const item = {

    name:
      nameInput.value.trim(),

    qty:
      Number(qtyInput.value),

    unit:
      unitInput.value.trim() || 'шт',

    price:
      Number(priceInput.value) || 0

  };

  if(!item.name){

    alert('Введите название');

    return;
  }

  if(isNaN(item.qty)){

    alert('Введите количество');

    return;
  }

  try{

    showLoader();

    await saveItem(item);

    await loadItems();

    hideLoader();

    nameInput.value = '';
    qtyInput.value = '';
    unitInput.value = '';
    priceInput.value = '';

    alert('✅ Материал добавлен');

  }catch(e){

    console.log(e);

    hideLoader();

    alert('Ошибка добавления');

  }

}

/* ================= RENDER ================= */

function render(){

  const tableBody =
    document.getElementById(
      'tableBody'
    );

  const grandTotal =
    document.getElementById(
      'grandTotal'
    );

  tableBody.innerHTML='';

  let total = 0;

  items.forEach((i,index)=>{

    const row =
      document.createElement('tr');

    const sum =
      Number(i.qty || 0) *
      Number(i.price || 0);

    total += sum;

    row.innerHTML = `

    <td>
      <strong>
        ${i.name || 'Без названия'}
      </strong>
    </td>

    <td>
      ${i.qty || 0}
      ${i.unit || 'шт'}
    </td>

    <td>
      ${Number(i.price || 0).toFixed(2)} ₴
    </td>

    <td>
      <strong>
      ${sum.toFixed(2)} ₴
      </strong>
    </td>

    <td class="qr-container">
      <div id="qr-${index}"></div>
    </td>

    <td>

      <div class="actions">

        <button
          class="btn-share"
          onclick="shareQR(${index})">

          📲

        </button>

        <button
          class="btn-edit"
          onclick="editItem(${index})">

          ✏️

        </button>

        <button
          class="btn-del"
          onclick="deleteItem(${index})">

          🗑

        </button>

      </div>

    </td>

    `;

    tableBody.appendChild(row);

    new QRCode(

      document.getElementById(
        `qr-${index}`
      ),

      {

        text:JSON.stringify({

          name:i.name,
          qty:i.qty,
          unit:i.unit,
          price:i.price

        }),

        width:120,
        height:120

      }

    );

  });

  grandTotal.textContent =
    total.toFixed(2);

}

/* ================= QR ================= */

function startScanner(){

  const scanner =
    new Html5Qrcode('reader');

  scanner.start(

    { facingMode:'environment' },

    {

      fps:10,
      qrbox:250

    },

    async(text)=>{

      try{

        const data =
          JSON.parse(text);

        const currentState =
          JSON.stringify(data);

        if(
          lastQR[data.name]
          === currentState
        ){

          alert('Нет изменений');

          scanner.stop();

          return;
        }

        lastQR[data.name] =
          currentState;

        const item = {

          name:data.name,
          qty:Number(data.qty),
          unit:data.unit || 'шт',
          price:Number(data.price)

        };

        showLoader();

        await saveItem(item);

        await loadItems();

        hideLoader();

        scanner.stop();

        alert('✅ QR загружен');

      }catch(e){

        console.log(e);

        hideLoader();

        scanner.stop();

        alert('Ошибка QR');

      }

    }

  );

}

/* ================= EDIT ================= */

function editItem(index){

  const item = items[index];

  const newName =
    prompt(
      'Название',
      item.name
    );

  if(newName === null) return;

  const newQty =
    prompt(
      'Количество',
      item.qty
    );

  if(newQty === null) return;

  const newUnit =
    prompt(
      'Единица',
      item.unit
    );

  if(newUnit === null) return;

  const newPrice =
    prompt(
      'Цена',
      item.price
    );

  if(newPrice === null) return;

  item.name = newName;
  item.qty = Number(newQty);
  item.unit = newUnit;
  item.price = Number(newPrice);

  render();

}

/* ================= DELETE ================= */

function deleteItem(index){

  if(confirm('Удалить?')){

    items.splice(index,1);

    render();

  }

}

/* ================= SHARE ================= */

function shareQR(){

  alert(
    'QR можно отправить скриншотом 🙂'
  );

}

/* ================= EXCEL ================= */

function exportExcel(){

  if(items.length === 0){

    alert('Нет данных');

    return;
  }

  const data =
    items.map(i=>({

      "Название":
      i.name,

      "Количество":
      i.qty,

      "Единица":
      i.unit,

      "Цена":
      i.price,

      "Сумма":
      Number(i.qty) *
      Number(i.price)

    }));

  const ws =
    XLSX.utils.json_to_sheet(data);

  const wb =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    'Склад'
  );

  XLSX.writeFile(
    wb,
    'Склад.xlsx'
  );

}

/* ================= AUTO LOGIN ================= */

window.onload = ()=>{

  const savedUser =
    localStorage.getItem(
      'warehouse_user'
    );

  const token =
    localStorage.getItem(
      'warehouse_token'
    );

  if(savedUser && token){

    user =
      JSON.parse(savedUser);

    document
    .getElementById('authScreen')
    .classList
    .add('hidden');

    document
    .getElementById('appScreen')
    .classList
    .remove('hidden');

    loadItems();

  }

}

</script>

</body>
</html>
