<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад Улік & QR Генератор</title>
    <!-- Подключаем библиотеку для генерации QR-кодов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg: #f4f7f6;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        h1 { color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        
        .form-group { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; margin-bottom: 20px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #219150; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: var(--primary); color: white; }

        .qr-container { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .print-btn { background: #3498db; font-size: 12px; }

        /* Стили для печати */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }

        #printArea { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Учёт склада (UAH ₴)</h1>
    
    <!-- Форма добавления -->
    <div class="form-group no-print">
        <input type="text" id="itemName" placeholder="Назва товару">
        <input type="number" id="itemPrice" placeholder="Ціна (грн)">
        <input type="number" id="itemQty" placeholder="Кількість">
        <button onclick="addItem()">Додати товар</button>
    </div>

    <!-- Таблица товаров -->
    <table id="inventoryTable">
        <thead>
            <tr>
                <th>Товар</th>
                <th>Ціна (₴)</th>
                <th>К-сть</th>
                <th>QR-код</th>
                <th class="no-print">Дії</th>
            </tr>
        </thead>
        <tbody id="inventoryBody">
            <!-- Сюда попадают данные -->
        </tbody>
    </table>
</div>

<!-- Скрытая область для печати только QR -->
<div id="printArea">
    <div id="qrToPrint"></div>
    <h2 id="nameToPrint" style="text-align: center;"></h2>
    <p id="priceToPrint" style="text-align: center;"></p>
</div>

<script>
    let inventory = [];

    function addItem() {
        const name = document.getElementById('itemName').value;
        const price = document.getElementById('itemPrice').value;
        const qty = document.getElementById('itemQty').value;

        if(!name || !price || !qty) return alert("Заповніть всі поля!");

        const item = {
            id: Date.now(),
            name,
            price: parseFloat(price).toFixed(2),
            qty
        };

        inventory.push(item);
        renderTable();
        clearInputs();
    }

    function clearInputs() {
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemQty').value = '';
    }

    function renderTable() {
        const tbody = document.getElementById('inventoryBody');
        tbody.innerHTML = '';

        inventory.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.name}</td>
                <td>${item.price} ₴</td>
                <td>${item.qty}</td>
                <td>
                    <div class="qr-container">
                        <div id="qr-${item.id}"></div>
                        <button class="print-btn no-print" onclick="printQR(${item.id})">Друкувати QR</button>
                    </div>
                </td>
                <td class="no-print">
                    <button style="background:#e74c3c" onclick="removeItem(${item.id})">Видалити</button>
                </td>
            `;
            tbody.appendChild(row);

            // Генерация QR для строки (содержит имя и цену)
            new QRCode(document.getElementById(`qr-${item.id}`), {
                text: `Товар: ${item.name} | Ціна: ${item.price} UAH`,
                width: 80,
                height: 80
            });
        });
    }

    function removeItem(id) {
        inventory = inventory.filter(i => i.id !== id);
        renderTable();
    }

    function printQR(id) {
        const item = inventory.find(i => i.id === id);
        const printArea = document.getElementById('qrToPrint');
        const printTitle = document.getElementById('nameToPrint');
        const printPrice = document.getElementById('priceToPrint');

        printArea.innerHTML = ''; // Очистка
        printTitle.innerText = item.name;
        printPrice.innerText = `Ціна: ${item.price} грн`;

        // Создаем крупный QR для печати
        new QRCode(printArea, {
            text: `ID:${item.id} | ${item.name} | ${item.price} UAH`,
            width: 250,
            height: 250
        });

        // Задержка перед печатью для рендера QR
        setTimeout(() => {
            document.getElementById('printArea').style.display = 'block';
            window.print();
            document.getElementById('printArea').style.display = 'none';
        }, 300);
    }
</script>

</body>
</html>
