<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Складской учет PRO Cloud</title>

<!-- QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

:root{
  --bg:#f0f2f5;
  --card:#ffffff;
  --primary:#3498db;
  --success:#2ecc71;
  --danger:#e74c3c;
  --orange:#f39c12;
}

body{
  margin:0;
  padding:0;
  background:var(--bg);
  font-family:'Segoe UI',Tahoma,sans-serif;
}

.hidden{
  display:none !important;
}

/* ================= AUTH ================= */

.auth-screen{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  box-sizing:border-box;
}

.auth-card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 4px 25px rgba(0,0,0,0.12);
}

.auth-title{
  text-align:center;
  font-size:30px;
  margin-bottom:25px;
  color:#2c3e50;
  font-weight:bold;
}

.auth-input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px;
}

.auth-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:10px;
  font-size:15px;
}

.login-btn{
  background:#3498db;
}

.register-btn{
  background:#2ecc71;
}

/* ================= LOADER ================= */

.loading-screen{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.loader{
  width:70px;
  height:70px;
  border:8px solid #eee;
  border-top:8px solid #3498db;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

/* ================= APP ================= */

.container{
  max-width:1300px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:20px;
  margin-top:20px;
  margin-bottom:20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
  overflow-x:auto;
}

h1{
  text-align:center;
  color:#2c3e50;
}

.form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin-bottom:20px;
}

input{
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  outline:none;
}

button{
  border:none;
  border-radius:10px;
  padding:12px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.btn-add{
  background:#2ecc71;
}

.btn-scan{
  background:#3498db;
}

.btn-excel{
  background:#27ae60;
}

.btn-share{
  background:#1da1f2;
  font-size:12px;
}

.btn-edit{
  background:#f39c12;
  font-size:12px;
}

.btn-del{
  background:#e74c3c;
  font-size:12px;
}

.btn-logout{
  background:#2c3e50;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th{
  background:#34495e;
  color:white;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.qr-container{
  display:flex;
  justify-content:center;
  align-items:center;
}

.qr-container img{
  width:180px;
  height:180px;
  image-rendering:pixelated;
}

#reader{
  width:100%;
  max-width:420px;
  margin:20px auto;
  border-radius:15px;
  overflow:hidden;
  border:3px solid #3498db;
}

.total-box{
  margin-top:20px;
  text-align:right;
  font-size:24px;
  font-weight:bold;
}

</style>

</head>
<body>

<!-- ================= LOADER ================= -->

<div id="loadingScreen" class="loading-screen hidden">

  <div class="loader"></div>

</div>

<!-- ================= AUTH ================= -->

<div id="authScreen" class="auth-screen">

  <div class="auth-card">

    <div class="auth-title">
      📦 Склад Cloud
    </div>

    <input
      id="email"
      class="auth-input"
      type="email"
      placeholder="Почта">

    <input
      id="password"
      class="auth-input"
      type="password"
      placeholder="Пароль">

    <button
      class="auth-btn login-btn"
      onclick="login()">

      🔐 Войти

    </button>

    <button
      class="auth-btn register-btn"
      onclick="register()">

      📝 Регистрация

    </button>

  </div>

</div>

<!-- ================= APP ================= -->

<div id="appScreen" class="hidden">

<div class="container">

<button
  class="btn-logout"
  onclick="logout()">

  🚪 Выйти

</button>

<h1>📦 Складской учет (QR + Excel)</h1>

<div class="form">

<input type="text" id="name" placeholder="Название">
<input type="number" id="qty" placeholder="Остаток">
<input type="text" id="unit" placeholder="Ед.">
<input type="number" id="price" placeholder="Цена">

<button class="btn-add" onclick="addItem()">
➕ Добавить
</button>

<button class="btn-scan" onclick="startScanner()">
📷 QR
</button>

<button class="btn-excel" onclick="exportExcel()">
📊 Excel
</button>

</div>

<div id="reader"></div>

<table>

<thead>

<tr>

<th>Товар</th>
<th>Остаток</th>
<th>Цена</th>
<th>Сумма</th>
<th>QR</th>
<th>Действия</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

<div class="total-box">

💰 Общая сумма:
<span id="grandTotal">0</span> ₴

</div>

</div>

</div>

<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
'https://zwoaxfrijvtfclzdodpf.supabase.co';

const SUPABASE_KEY =
'ВСТАВЬ_СВОЙ_ANON_KEY';

/* ================= STATE ================= */

let inventory = [];
let currentUser = null;
let lastQrState = {};

/* ================= LOADER ================= */

function showLoader(){

  document
  .getElementById('loadingScreen')
  .classList
  .remove('hidden');

}

function hideLoader(){

  document
  .getElementById('loadingScreen')
  .classList
  .add('hidden');

}

/* ================= AUTH ================= */

async function register(){

  const email =
    document.getElementById('email').value;

  const password =
    document.getElementById('password').value;

  if(!email || !password){

    alert('Введите данные');

    return;
  }

  showLoader();

  try{

    const response =
      await fetch(

        `${SUPABASE_URL}/auth/v1/signup`,

        {

          method:'POST',

          headers:{
            'apikey':SUPABASE_KEY,
            'Content-Type':'application/json'
          },

          body:JSON.stringify({
            email,
            password
          })

        }

      );

    const data =
      await response.json();

    hideLoader();

    console.log(data);

    if(data.user){

      alert('✅ Регистрация успешна');

    }else{

      alert('Ошибка регистрации');

    }

  }catch(e){

    hideLoader();

    console.log(e);

    alert('Ошибка регистрации');

  }

}

async function login(){

  const email =
    document.getElementById('email').value;

  const password =
    document.getElementById('password').value;

  if(!email || !password){

    alert('Введите данные');

    return;
  }

  showLoader();

  try{

    const response =
      await fetch(

        `${SUPABASE_URL}/auth/v1/token?grant_type=password`,

        {

          method:'POST',

          headers:{
            'apikey':SUPABASE_KEY,
            'Content-Type':'application/json'
          },

          body:JSON.stringify({
            email,
            password
          })

        }

      );

    const data =
      await response.json();

    console.log(data);

    if(data.access_token){

      currentUser = data.user;

      localStorage.setItem(
        'warehouse_user',
        JSON.stringify(data.user)
      );

      hideLoader();

      document
      .getElementById('authScreen')
      .classList
      .add('hidden');

      document
      .getElementById('appScreen')
      .classList
      .remove('hidden');

      loadInventory();

    }else{

      hideLoader();

      alert('❌ Неверная почта или пароль');

    }

  }catch(e){

    hideLoader();

    console.log(e);

    alert('Ошибка входа');

  }

}

function logout(){

  localStorage.removeItem(
    'warehouse_user'
  );

  location.reload();

}

/* ================= DATABASE ================= */

async function loadInventory(){

  if(!currentUser){

    return;
  }

  try{

    const response =
      await fetch(

        `${SUPABASE_URL}/rest/v1/items?user_id=eq.${currentUser.id}`,

        {

          headers:{
            'apikey':SUPABASE_KEY
          }

        }

      );

    const data =
      await response.json();

    console.log(data);

    if(Array.isArray(data)){

      inventory = data;

      render();

    }else{

      inventory = [];

      render();

    }

  }catch(e){

    console.log(e);

    inventory = [];

    render();

  }

}

async function saveItemToCloud(item){

  try{

    await fetch(

      `${SUPABASE_URL}/rest/v1/items`,

      {

        method:'POST',

        headers:{
          'apikey':SUPABASE_KEY,
          'Content-Type':'application/json',
          'Prefer':'return=minimal'
        },

        body:JSON.stringify({

          user_id:currentUser.id,

          name:item.name,

          qty:item.qty,

          unit:item.unit,

          price:item.price

        })

      }

    );

  }catch(e){

    console.log(e);

  }

}

/* ================= RENDER ================= */

function render(){

  const tbody =
    document.getElementById('tableBody');

  const grandTotal =
    document.getElementById('grandTotal');

  tbody.innerHTML = '';

  let totalSum = 0;

  inventory.forEach((item,index)=>{

    const row =
      document.createElement('tr');

    const itemSum =
      Number(item.qty) *
      Number(item.price);

    totalSum += itemSum;

    const qrData =
      encodeURIComponent(

        JSON.stringify({

          name:item.name,
          qty:item.qty,
          unit:item.unit,
          price:item.price

        })

      );

    row.innerHTML = `

    <td>
      <strong>${item.name}</strong>
    </td>

    <td>
      ${item.qty} ${item.unit}
    </td>

    <td>
      ${Number(item.price).toFixed(2)} ₴
    </td>

    <td>
      <strong>
        ${itemSum.toFixed(2)} ₴
      </strong>
    </td>

    <td class="qr-container">

      <div id="qr-${index}"></div>

    </td>

    <td>

      <div class="actions">

        <button
          class="btn-share"
          onclick="shareQR(${index})">

          📲 Переслать

        </button>

        <button
          class="btn-edit"
          onclick="editItem(${index})">

          ✏️ Изменить

        </button>

        <button
          class="btn-del"
          onclick="deleteItem(${index})">

          🗑 Удалить

        </button>

      </div>

    </td>

    `;

    tbody.appendChild(row);

    const qrElement =
      document.getElementById(`qr-${index}`);

    qrElement.innerHTML = '';

    new QRCode(qrElement,{

      text:qrData,

      width:180,
      height:180,

      colorDark:"#000000",
      colorLight:"#ffffff",

      correctLevel:
      QRCode.CorrectLevel.H

    });

  });

  grandTotal.textContent =
    totalSum.toFixed(2);

}

/* ================= ADD ================= */

async function addItem(){

  const name =
    document.getElementById('name')
    .value.trim();

  const qty =
    Number(
      document.getElementById('qty').value
    );

  const unit =
    document.getElementById('unit')
    .value.trim() || 'шт';

  const price =
    Number(
      document.getElementById('price').value
    ) || 0;

  if(!name || isNaN(qty)){

    alert('Введите данные');

    return;
  }

  const item = {

    name,
    qty,
    unit,
    price

  };

  inventory.push(item);

  render();

  await saveItemToCloud(item);

  document.getElementById('name').value='';
  document.getElementById('qty').value='';
  document.getElementById('unit').value='';
  document.getElementById('price').value='';

}

/* ================= QR ================= */

function startScanner(){

  const scanner =
    new Html5Qrcode('reader');

  scanner.start(

    { facingMode:'environment' },

    {

      fps:30,

      qrbox:{
        width:300,
        height:300
      }

    },

    async(text)=>{

      try{

        const decoded =
          decodeURIComponent(text);

        const data =
          JSON.parse(decoded);

        const currentState =
          JSON.stringify(data);

        if(
          lastQrState[data.name]
          === currentState
        ){

          alert(
            '⚠️ Изменений нет'
          );

          scanner.stop();

          return;
        }

        lastQrState[data.name] =
          currentState;

        const existing =
          inventory.find(
            i=>i.name===data.name
          );

        if(existing){

          existing.qty = data.qty;
          existing.unit = data.unit;
          existing.price = data.price;

        }else{

          inventory.push(data);

          await saveItemToCloud(data);

        }

        render();

        scanner.stop();

        alert(
          '✅ QR обновлён'
        );

      }catch(e){

        console.log(e);

        alert('Ошибка QR');

        scanner.stop();

      }

    }

  );

}

/* ================= SHARE ================= */

async function shareQR(index){

  const container =
    document.getElementById(
      `qr-${index}`
    );

  const img =
    container.querySelector('img');

  if(!img){

    return;
  }

  try{

    const response =
      await fetch(img.src);

    const blob =
      await response.blob();

    const file =
      new File(

        [blob],

        `qr-${inventory[index].name}.png`,

        {
          type:'image/png'
        }

      );

    if(
      navigator.canShare &&
      navigator.canShare({
        files:[file]
      })
    ){

      await navigator.share({

        title:
          inventory[index].name,

        text:
          'QR код товара',

        files:[file]

      });

    }

  }catch(e){

    console.log(e);

  }

}

/* ================= EDIT ================= */

function editItem(index){

  const item =
    inventory[index];

  const newName =
    prompt(
      'Название',
      item.name
    );

  if(newName === null) return;

  const newQty =
    prompt(
      'Остаток',
      item.qty
    );

  if(newQty === null) return;

  const newUnit =
    prompt(
      'Единица',
      item.unit
    );

  if(newUnit === null) return;

  const newPrice =
    prompt(
      'Цена',
      item.price
    );

  if(newPrice === null) return;

  inventory[index] = {

    ...item,

    name:newName,

    qty:Number(newQty),

    unit:newUnit,

    price:Number(newPrice)

  };

  render();

}

/* ================= DELETE ================= */

function deleteItem(index){

  if(confirm('Удалить товар?')){

    inventory.splice(index,1);

    render();

  }

}

/* ================= EXCEL ================= */

function exportExcel(){

  if(inventory.length === 0){

    alert('Нет данных');

    return;
  }

  const excelData =
    inventory.map(item=>({

      "Товар":
      item.name,

      "Остаток":
      item.qty,

      "Единица":
      item.unit,

      "Цена":
      item.price,

      "Сумма":
      item.qty * item.price

    }));

  const worksheet =
    XLSX.utils.json_to_sheet(
      excelData
    );

  const workbook =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(

    workbook,

    worksheet,

    'Склад'

  );

  XLSX.writeFile(

    workbook,

    'Склад.xlsx'

  );

}

/* ================= AUTO LOGIN ================= */

window.onload = ()=>{

  const savedUser =
    localStorage.getItem(
      'warehouse_user'
    );

  if(savedUser){

    currentUser =
      JSON.parse(savedUser);

    document
    .getElementById('authScreen')
    .classList
    .add('hidden');

    document
    .getElementById('appScreen')
    .classList
    .remove('hidden');

    loadInventory();

  }

}

</script>

</body>
</html>
