<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад Улік & QR PRO</title>
    <!-- Используем более стабильную библиотеку QRious -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg: #f4f7f6;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .form-group { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; margin-bottom: 20px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { opacity: 0.9; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: var(--primary); color: white; }

        .qr-preview { background: white; border: 1px solid #eee; }
        .print-btn { background: #3498db; margin-top: 5px; font-size: 11px; }

        /* СТИЛИ ДЛЯ ПЕЧАТИ */
        @media print {
            body * { visibility: hidden; }
            #printSection, #printSection * { visibility: visible; }
            #printSection {
                position: absolute;
                left: 0; top: 0;
                width: 100%;
                display: flex !important;
                flex-direction: column;
                align-items: center;
                padding-top: 50px;
            }
            .no-print { display: none !important; }
        }

        #printSection { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Складський облік ₴</h1>
    
    <div class="form-group no-print">
        <input type="text" id="itemName" placeholder="Назва товару">
        <input type="number" id="itemPrice" placeholder="Ціна (грн)">
        <input type="number" id="itemQty" placeholder="Кількість">
        <button onclick="addItem()">Додати</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Товар</th>
                <th>Ціна</th>
                <th>К-сть</th>
                <th>QR Код</th>
                <th class="no-print">Дії</th>
            </tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
    </table>
</div>

<!-- Специальная зона для печати -->
<div id="printSection">
    <h2 id="printName"></h2>
    <canvas id="printCanvas"></canvas>
    <h3 id="printPrice"></h3>
</div>

<script>
    let inventory = [];

    function addItem() {
        const name = document.getElementById('itemName').value;
        const price = document.getElementById('itemPrice').value;
        const qty = document.getElementById('itemQty').value;

        if(!name || !price || !qty) return alert("Заповніть поля!");

        const item = {
            id: Date.now().toString(),
            name,
            price: parseFloat(price).toFixed(2),
            qty
        };

        inventory.push(item);
        renderTable();
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemQty').value = '';
    }

    function renderTable() {
        const tbody = document.getElementById('inventoryBody');
        tbody.innerHTML = '';

        inventory.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><b>${item.name}</b></td>
                <td>${item.price} грн</td>
                <td>${item.qty}</td>
                <td>
                    <canvas id="canvas-${item.id}" class="qr-preview"></canvas><br>
                    <button class="print-btn no-print" onclick="preparePrint('${item.id}')">Друк QR</button>
                </td>
                <td class="no-print">
                    <button style="background:#e74c3c" onclick="deleteItem('${item.id}')">Видалити</button>
                </td>
            `;
            tbody.appendChild(row);

            // Генерация QR прямо в таблицу
            new QRious({
                element: document.getElementById(`canvas-${item.id}`),
                value: `ITEM:${item.name}|PRICE:${item.price}|ID:${item.id}`,
                size: 80
            });
        });
    }

    function deleteItem(id) {
        inventory = inventory.filter(i => i.id !== id);
        renderTable();
    }

    function preparePrint(id) {
        const item = inventory.find(i => i.id === id);
        
        // Подготовка данных в зоне печати
        document.getElementById('printName').innerText = item.name;
        document.getElementById('printPrice').innerText = "Ціна: " + item.price + " грн";

        // Генерация большого QR для печати
        new QRious({
            element: document.getElementById('printCanvas'),
            value: `ITEM:${item.name}|PRICE:${item.price}|ID:${item.id}`,
            size: 300
        });

        // Небольшая пауза для рендеринга canvas перед вызовом окна печати
        setTimeout(() => {
            window.print();
        }, 300);
    }
</script>

</body>
    </html>
